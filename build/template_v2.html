    html += '</div>';

    // 지원 카드 추천 목록 (희망 계열 필터 자동 적용, 지역→구간→신뢰도 정렬)
    const cards = getCards(student).filter(c => !c.noCut);
    const top = cards.filter(c => c.band === '안정' || c.band === '적정' || c.band === '소신').slice(0, 15);
    html += `<div class="glass"><h3>지원 카드 추천 <span style="font-size:10px;color:var(--muted);font-weight:400">(대학×전형×학과 단위 · ${hope.length ? '희망 계열 ' + hope.length + '개' : '전체 계열'} 대상 ${cards.length}장)</span></h3>`;
    if (!top.length) {
      html += '<p style="font-size:12px;color:var(--muted)">안정·적정·소신 구간 카드가 없습니다. 희망 계열을 넓히거나 상향 카드를 검토하세요.</p>';
    } else {
      top.forEach(c => {
        const bs = BAND_STYLE[c.band] || {};
        html += `<div class="match-row" onclick="showUnivDetail('${esc(c.univ)}')" style="cursor:pointer">
          <span class="match-badge" style="background:${bs.color || 'var(--muted)'};color:#fff;min-width:34px">${c.bandAdjusted ? '충원 감안 시 ' + c.band : c.band}</span>
          <div class="match-body">
            <div class="univ">${esc(c.univ)} <strong>${esc(c.dept)}</strong> <span style="font-size:10px;color:var(--muted)">${esc(c.jn || c.jt)}</span> ${judgeRelBadge(c.rel)}</div>
            <div class="jeon">${esc(c.sub || c.gy || '')} · 50컷 ${c.g50 ?? '-'} · 70컷 ${c.g70 ?? '-'} · 경쟁률 ${c.ratio ?? '-'}${c.cw != null ? ' · 충원 ' + c.cw.toFixed(1) + '배수' : ''}</div>
          </div>
          <div class="match-num"><div class="unit">평균 ${c.stAvg} / 환산 ${c.score}</div></div>
        </div>`;
      });
    }
    html += '</div>';
  }

  // Stats
  const highRel = results.filter(r => r.reliability === 'high').length;
  const ruleCnt = results.filter(r => r.ruleType !== '어디가 실적 기반').length;
  const adigaCnt = results.length - ruleCnt;
  const withDeptCut = results.filter(r => r.deptCut && r.deptCut.cut != null).length;
  html += '<div class="glass"><h3>대학별 내신 환산 결과</h3>';
  html += '<div class="stat-grid">';
  html += `<div class="stat-box"><div class="num">${results.length}</div><div class="label">분석 대상 대학</div><div style="font-size:9px;color:var(--muted);margin-top:2px">환산 ${ruleCnt} + 실적기반 ${adigaCnt}</div></div>`;
  html += `<div class="stat-box"><div class="num">${highRel}</div><div class="label">고신뢰 환산</div></div>`;
  html += `<div class="stat-box"><div class="num">${withDeptCut}</div><div class="label">학과컷 비교</div></div>`;
  html += '</div>';

  html += '</div>';

  // ── 지역 목표 + 실제 합격선 매칭 (수박/어디가 자료) ──
  const stAvg = calcWeightedAvg(student);
  const stTrack = getStudentTrack(student, analysis);
  const target = getTargetRegion(stAvg);
  const realMatches = matchRealAdmissions(student, analysis);
  window._realMatchCache = realMatches;

  const targetLabel = target === '수도권' ? '수도권 (인서울·인경기)' : '충청권';
  const targetDesc = target === '수도권'
    ? '전과목 평균이 5점대 이내이므로 <strong>인서울·인경기</strong> 대학을 목표로 지원 전략을 구성합니다.'
    : '전과목 평균이 6점대 이상이므로 <strong>충청권</strong> 대학을 중심으로 지원 전략을 구성합니다.';
  html += `<div class="glass" style="border-left:4px solid ${target === '수도권' ? 'var(--teal)' : 'var(--copper)'}">
    <h3>지역 목표 설정</h3>
    <div style="display:flex;align-items:center;gap:12px;margin:8px 0">
      <div style="padding:8px 16px;background:${target === '수도권' ? 'var(--teal-light)' : 'var(--copper-light)'};border-radius:10px;font-size:15px;font-weight:800;color:${target === '수도권' ? 'var(--teal)' : 'var(--copper)'}">${targetLabel}</div>
      <div style="font-size:12px;color:var(--sub);line-height:1.5">${targetDesc}</div>
    </div>
    <div style="font-size:11px;color:var(--muted)">학생 전과목 평균 <strong>${stAvg.toFixed(2)}등급</strong> · 계열 판정 <strong>${stTrack}</strong> · 실제 합격선 자료(2025~2026 수박/어디가) 기준</div>
  </div>`;

  // 실제 합격선 기반 대학 매칭 — 인서울>인경기>충남권 순, 동일 지역 내 합격확률순
  const byRegionThenProb = (a, b) => b.bestProb - a.bestProb;
  const targetMatches = sortByRegionPriority(
    realMatches.filter(m => inTargetRegion(m.region, target)), regionOf, byRegionThenProb);
  const otherMatches = sortByRegionPriority(
    realMatches.filter(m => !inTargetRegion(m.region, target)), regionOf, byRegionThenProb);

  const renderRealRow = (m) => {
    const band = realBand(m.bestProb);
    const rc = REGION_COLOR[m.region] || 'var(--muted)';
    const entryLine = m.entries.map(e => `${e.jt} ${classifyBand(stAvg, e.cut, e.cut) || '컷없음'}`).join(' · ');
    const trBadge = ' ' + trendBadge(getDeptTrend(m.univ, null, student, m.bestType));
    const cBadge = ' ' + confBadge(m.univ);
    return `<div class="match-row" onclick="showRealDetail('${esc(m.univ)}')" style="cursor:pointer">
      <span class="match-badge" style="background:${band.color};color:#fff;min-width:34px">${band.label}</span>
      <div class="match-body">
        <div class="univ">${esc(m.univ)} <span style="font-size:10px;padding:1px 7px;border-radius:8px;background:${rc}22;color:${rc};font-weight:600">${REGION_LABEL[m.region]}</span>${trBadge}${cBadge}</div>
        <div class="jeon">${esc(entryLine)} · 합격선 ${m.bestCut}등급(${esc(m.bestType)})</div>
      </div>
      <div class="match-num">
        <div>${bandBadge(classifyBand(stAvg, m.bestCut, m.bestCut))}</div>
        <div class="unit">${m.track} 기준</div>
      </div>
    </div>`;
  };

  // [카드 전환] 수도권 매칭 — getCards() 기반 학과×전형 단위 보드
  html += `<div class="glass"><h3>수도권 매칭 — 실제 합격선 (학과·전형 단위)</h3>
    <p style="font-size:11px;color:var(--muted);margin-bottom:8px">어디가 학과별 등급50/70과 학생 평균등급(${stAvg.toFixed(2)})을 비교한 카드 목록입니다. 목표 권역: <strong>${targetLabel}</strong></p>
    <div id="board-realmatch"></div></div>`;

  // [카드 전환] 컷라인 비교 — getCards() 기반 (컷 보유 카드만)
  html += `<div class="glass"><h3>합격 가능성 분석 — 컷라인 비교 (학과·전형 단위)</h3>
    <p style="font-size:11px;color:var(--muted);margin-bottom:8px">등급50/70 컷이 있는 지원 카드만 표시합니다. 행 형식: 학과 · 전형(유형) — 환산 vs 50/70컷 — 구간 — 충원배수 — 신뢰도</p>
    <div id="board-cutcmp"></div></div>`;

  // All results table
  // Strategic portfolio recommendation (auto-analysis for all students)
  const allComps = results.map(r => {
    const comp = calcCompositeScore(r, student, analysis);
    return { ...r, prob: comp.probability, comp };
  }).sort((a, b) => b.prob - a.prob);

  // 4구간 band(최신 판정 로직)와 동일 기준으로 그룹핑 — 배지·그룹 헤더 불일치 방지
  const safeUnis = allComps.filter(r => r.comp.band === '안정');
  const fitUnis = allComps.filter(r => r.comp.band === '적정');
  const reachUnis = allComps.filter(r => r.comp.band === '소신');
  const hardUnis = allComps.filter(r => r.comp.band === '상향');

  // [카드 전환] 전략적 지원 추천 — 지원 카드 단위 + 2계층 판정 표시
  const hopeSubs = getHopeSubs(student.seat);
  const stratCards = getCards(student).filter(c => !c.noCut);   // 희망 계열 자동 적용
  const compMap = compByUniv(student, analysis);
  const cnt = b => stratCards.filter(c => c.band === b).length;
  html += '<div class="glass"><h3>전략적 지원 추천 <span style="font-size:10px;color:var(--muted);font-weight:400">(지원 카드 단위 · ' + (hopeSubs.length ? '희망 계열 ' + hopeSubs.length + '개' : '전체 계열') + ')</span></h3>';
  html += '<p style="font-size:11px;color:var(--muted);margin-bottom:12px">1차 표시는 4구간 판정, 카드를 펼치면 판정 근거와 실사용 요인 기여도가 보입니다.</p>';
  html += '<div class="tier-grid">';
  [['안정','var(--green)','green'],['적정','var(--blue)','blue'],['소신','var(--orange)','orange'],['상향','var(--red)','red']].forEach(([b, c, k]) => {
    html += `<div style="padding:10px;background:var(--${k}-light);border-radius:8px;text-align:center">
      <div style="font-size:22px;font-weight:800;color:${c}">${cnt(b)}</div>
      <div style="font-size:11px;color:var(--muted)">${b} 카드</div></div>`;
  });
  html += '</div>';
  const stratPick = [];
  for (const b of ['안정', '적정', '소신']) {
    const n = b === '소신' ? 3 : 4;
    stratPick.push(...stratCards.filter(c => c.band === b).slice(0, n));
  }
  stratPick.forEach(c => { html += cardDetailHtml(c, compMap[c.univ]); });
  if (!stratPick.length) html += '<p style="font-size:12px;color:var(--muted)">안정·적정·소신 카드가 없습니다. 희망 계열을 넓혀 보세요.</p>';

  // 전형 전략 분석
  const strat = calcAdmissionStrategy(student, analysis);
  html += '<div style="margin-top:14px;padding:14px;background:var(--card);border-radius:12px;border:1px solid var(--border)">';
  html += '<div style="font-size:13px;font-weight:700;color:var(--teal);margin-bottom:10px">전형 전략 분석</div>';

  // Three-bar chart
  html += '<div style="display:flex;gap:8px;margin-bottom:10px">';
  strat.sorted.forEach(([type, score]) => {
    const color = type === '교과' ? 'var(--teal)' : type === '종합' ? 'var(--blue)' : 'var(--orange)';
    const isBest = type === strat.sorted[0][0];
    html += `<div style="flex:1;text-align:center">
      <div style="font-size:11px;font-weight:${isBest ? '700' : '500'};color:${isBest ? color : 'var(--sub)'};margin-bottom:4px">${type}전형</div>
      <div style="height:60px;background:var(--cream);border-radius:6px;position:relative;overflow:hidden">
        <div style="position:absolute;bottom:0;left:0;right:0;height:${score}%;background:${color};opacity:${isBest ? 0.7 : 0.3};border-radius:0 0 6px 6px;transition:height 0.3s"></div>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
          <span class="mono" style="font-size:${isBest ? 18 : 14}px;font-weight:700;color:${isBest ? color : 'var(--muted)'}">${score}</span>
        </div>
      </div>
    </div>`;
  });
  html += '</div>';

  // Strategy recommendation
  html += `<div style="padding:8px 12px;background:var(--cream);border-radius:8px;border-left:3px solid var(--teal)">
    <div style="font-size:12px;font-weight:700;color:var(--teal);margin-bottom:2px">${esc(strat.strategy)}</div>
    <div style="font-size:11px;color:var(--sub);line-height:1.5">${esc(strat.detail)}</div>
  </div>`;

  // Key indicators
  if (strat.foundKeywords.length > 0 || strat.fitScore > 0) {
    html += '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">';
    if (strat.foundKeywords.length > 0) {
      html += `<span style="font-size:10px;padding:2px 8px;background:rgba(0,122,255,0.08);border-radius:10px;color:var(--blue)">생기부 키워드: ${strat.foundKeywords.join(', ')}</span>`;
    }
    html += `<span style="font-size:10px;padding:2px 8px;background:rgba(20,58,64,0.06);border-radius:10px;color:var(--sub)">생기부 ${Math.round(strat.recordChars/100)/10}천자</span>`;
    html += '</div>';
  }
  html += '</div>';

  // 전형별 대학 추천 (grouped by admission type)
  const 교과Results = allComps.filter(r => !r.comp.is종합 && !r.comp.is논술);
  const 종합Results = allComps.filter(r => r.comp.is종합);
  const 논술Results = allComps.filter(r => r.comp.is논술);
  const hasMultipleTypes = (교과Results.length > 0 ? 1 : 0) + (종합Results.length > 0 ? 1 : 0) + (논술Results.length > 0 ? 1 : 0) >= 2;

  // [카드 전환] 전형별 추천 — 교과/종합/논술 탭 + 2계층 카드
  {
    const ra2 = analyzeRecord(student, analysis);
    const threads2 = studentTopicThreads(student, ra2);
    const alignedNames = threads2.filter(t => t.aligned && t.continuity !== '단발').map(t => t.topic);
    const threadLine = alignedNames.length
      ? `<strong style="color:var(--teal)">계열 정합 스레드:</strong> ${alignedNames.slice(0, 4).map(esc).join(', ')} <span style="color:var(--green);font-weight:700">보유 ✓</span>`
      : `<strong style="color:var(--teal)">계열 정합 스레드:</strong> <span style="color:var(--red);font-weight:700">없음</span> — 지원 계열 연속 활동 보완 필요`;
    html += '<div style="margin-top:14px;padding:14px;background:var(--card);border-radius:12px;border:1px solid var(--border)">';
    html += '<div style="font-size:13px;font-weight:700;color:var(--teal);margin-bottom:10px">전형별 추천 (지원 카드 단위)</div>';
    html += '<div style="display:flex;gap:6px;margin-bottom:10px">';
    ['교과', '종합', '논술'].forEach(t => {
      const on = _typeTabSel === t;
      html += `<button onclick="setTypeTab('${t}')" style="padding:5px 16px;border-radius:10px;border:1px solid ${on ? 'var(--teal)' : 'var(--border)'};background:${on ? 'var(--teal)' : 'var(--card)'};color:${on ? '#fff' : 'var(--sub)'};font-weight:${on ? 700 : 400};cursor:pointer;font-family:inherit;font-size:12px">${t}</button>`;
    });
    html += '</div>';
    const typeCards = getCards(student, { jt: _typeTabSel }).filter(c => !c.noCut)
      .filter(c => c.band === '안정' || c.band === '적정' || c.band === '소신').slice(0, 8);
    if (!typeCards.length) {
      html += `<p style="font-size:12px;color:var(--muted)">${_typeTabSel} 전형의 안정·적정·소신 카드가 없습니다.</p>`;
    } else {
      typeCards.forEach(c => {
        const extras = [];
        if (_typeTabSel === '종합') extras.push(threadLine);   // 종합: 계열 정합 스레드 보유 여부
        if (_typeTabSel === '논술') {                          // 논술: 수능최저 충족 가능성
          const min = findMinSpec(c.univ, c.dept);
          extras.push(min
            ? `<strong style="color:var(--teal)">수능최저:</strong> ${esc(min)} ${minReqBadge(student, min, c.dept)}`
            : `<strong style="color:var(--teal)">수능최저:</strong> 자료 없음 — 모집요강 확인 필요`);
        }
        html += cardDetailHtml(c, compMap[c.univ], extras);
      });
    }
    html += '</div>';
  }

  // 6지원 최적 포트폴리오 시뮬레이터
  if (allComps.length >= 6) {
    const optPortfolio = calcOptimalPortfolio(allComps, 6);
    html += '<div style="margin-top:14px;padding:14px;background:var(--teal-light);border-radius:12px;border:1px solid rgba(20,58,64,0.15)">';
    html += '<div style="font-size:13px;font-weight:700;color:var(--teal);margin-bottom:8px">AI 최적 6지원 시뮬레이션</div>';
    html += '<p style="font-size:11px;color:var(--sub);margin-bottom:10px">합격 확률, 대학 티어, 전형 다양성을 종합 최적화한 6개 대학 조합입니다.</p>';

    // Risk distribution bar
    const total = optPortfolio.picks.length;
    const sPct = Math.round(optPortfolio.safeCount / total * 100);
    const fPct = Math.round(optPortfolio.fitCount / total * 100);
    const rPct = 100 - sPct - fPct;
    const riskColor = optPortfolio.riskLevel === '안정적' ? 'var(--green)' : optPortfolio.riskLevel === '균형' ? 'var(--blue)' : optPortfolio.riskLevel === '주의' || optPortfolio.riskLevel === '위험' ? 'var(--red)' : 'var(--orange)';
    html += `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px">
        <span>안정 ${optPortfolio.safeCount}교 / 적정 ${optPortfolio.fitCount}교 / 소신 ${optPortfolio.reachCount}교</span>
        <span style="font-weight:700;color:${riskColor}">${optPortfolio.riskLevel}</span>
      </div>
      <div style="display:flex;height:8px;border-radius:4px;overflow:hidden">
        ${sPct > 0 ? `<div style="width:${sPct}%;background:var(--green)"></div>` : ''}
        ${fPct > 0 ? `<div style="width:${fPct}%;background:var(--blue)"></div>` : ''}
        ${rPct > 0 ? `<div style="width:${rPct}%;background:var(--orange)"></div>` : ''}
      </div>
    </div>`;

    // Type breakdown chips
    const typeEntries = Object.entries(optPortfolio.typeBreakdown);
    if (typeEntries.length > 1) {
      html += '<div style="display:flex;gap:6px;margin-bottom:8px">';
      typeEntries.forEach(([t, c]) => {
        const tc = t === '교과' ? 'var(--teal)' : t === '종합' ? 'var(--blue)' : 'var(--orange)';
        html += `<span style="font-size:10px;padding:2px 8px;background:${tc}15;border-radius:10px;color:${tc};font-weight:600">${t} ${c}교</span>`;
      });
      html += '</div>';
    }

    html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">';
    optPortfolio.picks.forEach((p, i) => {
      const tierLabel = p.prob >= 65 ? '안정' : p.prob >= 40 ? '적정' : p.prob >= 15 ? '소신' : '도전';
      const tColor = p.prob >= 65 ? 'var(--green)' : p.prob >= 40 ? 'var(--blue)' : p.prob >= 15 ? 'var(--orange)' : 'var(--red)';
      const typeTag = p.comp.is논술 ? '논술' : p.comp.is종합 ? '종합' : '교과';
      html += `<div style="padding:8px;background:var(--card);border-radius:8px;border:1px solid var(--border);cursor:pointer;text-align:center" onclick="showUnivDetail('${esc(p.univ)}')">
        <div style="display:flex;justify-content:center;gap:4px;margin-bottom:2px">
          <span style="font-size:9px;color:${tColor};font-weight:700">${tierLabel}</span>
          <span style="font-size:9px;color:var(--muted)">${typeTag}</span>
        </div>
        <div style="font-size:12px;font-weight:600;margin:2px 0">${esc(p.univ)}</div>
        <div style="font-size:13px;font-weight:800;color:${p.comp.band ? (BAND_STYLE[p.comp.band] || {}).color : 'var(--muted)'}">${p.comp.bandLabel || '컷없음'}</div>
        <div style="font-size:10px;color:var(--muted)">${esc((p.jeonType||'').substring(0,6))}</div>
      </div>`;
    });
    html += '</div>';

    // Duplicate university warning
    if (optPortfolio.dupUnivs.length > 0) {
      html += `<div style="margin-top:6px;padding:6px 10px;background:var(--orange-light);border-radius:6px;font-size:11px;color:var(--orange)">
        동일 대학 중복 지원: ${optPortfolio.dupUnivs.join(', ')} — 대학별 복수 지원 가능 여부를 확인하세요.
      </div>`;
    }

    html += `<div style="margin-top:8px;text-align:center;font-size:12px;color:var(--sub)">
      최소 1개 합격 확률: <strong class="mono" style="color:var(--teal);font-size:16px">${optPortfolio.atLeastOne}%</strong>
      · 기대 합격 수: <strong class="mono" style="color:var(--teal)">${optPortfolio.expectedCount.toFixed(1)}교</strong>
    </div>`;

    // Risk advice
    html += `<div style="margin-top:6px;padding:6px 10px;background:var(--cream);border-radius:6px;font-size:11px;color:var(--sub);border-left:3px solid ${riskColor}">
      ${optPortfolio.riskAdvice}
    </div>`;

    // Classmate competition: use heatmap cache to avoid recalculating for all students
    const portUnivs = optPortfolio.picks.map(p => p.univ);
    if (!_cache.studentUnivProbs) {
      _cache.studentUnivProbs = {};
      STUDENTS.forEach((s2, idx2) => {
        const a2 = ANALYSIS[s2.seat] || {};
        const r2 = runAllUniversities(s2);
        const probs = {};
        r2.forEach(r => {
          const c2 = calcCompositeScore(r, s2, a2);
          if (c2.probability >= 30) probs[r.univ] = c2.probability;
        });
        _cache.studentUnivProbs[idx2] = probs;
      });
    }
    const competitors = [];
    STUDENTS.forEach((s2, idx2) => {
      if (idx2 === selectedIdx) return;
      const probs = _cache.studentUnivProbs[idx2] || {};
      const overlaps = [];
      portUnivs.forEach(u => {
        if (probs[u]) overlaps.push({ univ: u, prob: probs[u] });
      });
      if (overlaps.length >= 2) competitors.push({ name: s2.name, seat: s2.seat, idx: idx2, overlaps });
    });

    if (competitors.length > 0) {
      competitors.sort((a, b) => b.overlaps.length - a.overlaps.length);
      html += `<div style="margin-top:8px;padding:8px 10px;background:var(--purple-light);border-radius:6px;font-size:11px">
        <div style="font-weight:700;color:var(--purple);margin-bottom:4px">학급 내 지원 경합 (${competitors.length}명)</div>`;
      competitors.slice(0, 5).forEach(c => {
        html += `<div style="display:flex;justify-content:space-between;padding:2px 0;cursor:pointer" onclick="selectStudent(${c.idx})">
          <span>${c.seat}번 ${esc(c.name)}</span>
          <span style="color:var(--muted)">${c.overlaps.map(o => esc(o.univ) + '(' + o.prob + '%)').join(', ')}</span>
        </div>`;
      });
      if (competitors.length > 5) html += `<div style="color:var(--muted)">+${competitors.length - 5}명 더</div>`;
      html += '</div>';
    }

    html += '</div>';
  }

  html += '</div>';

  // What-if grade simulation
  html += '<div class="glass"><h3>성적 변화 시뮬레이션</h3>';
  html += '<p style="font-size:11px;color:var(--sub);margin-bottom:10px">남은 학기에 성적이 변화하면 합격 확률이 어떻게 달라지는지 시뮬레이션합니다.</p>';
  html += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
    <label style="font-size:12px;font-weight:600;white-space:nowrap">등급 변화:</label>
    <input type="range" id="whatifSlider" min="-15" max="15" value="0" step="1"
      style="flex:1;accent-color:var(--teal)" oninput="runWhatIf(this.value)">
    <span id="whatifLabel" class="mono" style="font-size:14px;font-weight:700;color:var(--teal);min-width:60px;text-align:center">현재</span>
  </div>`;
  html += '<div id="whatifResult" style="display:none;padding:10px;background:var(--cream);border-radius:10px;font-size:12px;line-height:1.6"></div>';
  html += '</div>';

  // [카드 전환] 전체 환산 결과 — getCards() 기반 (컷 정보 없음 카드 포함)
  html += `<div class="glass" id="allUnivSection"><h3>전체 환산 결과 (학과·전형 단위 카드)</h3>
    <p style="font-size:11px;color:var(--muted);margin-bottom:8px">전체 지원 카드입니다. 컷 정보가 없는 카드는 '컷 정보 없음 — 경쟁률 참고'로 표시됩니다.</p>
    <div id="board-allresults"></div></div>`;

  // Portfolio section (favorites)
  const favKey = `fav_${student.seat}`;
  const studentFavs = favorites[favKey] || [];
  if (studentFavs.length > 0) {
    html += '<div class="glass"><h3>지원 전략 포트폴리오</h3>';
    html += '<p style="font-size:11px;color:var(--muted);margin-bottom:12px">즐겨찾기한 대학들의 지원 전략을 종합적으로 분석합니다.</p>';
    const favResults = results.filter(r => studentFavs.includes(r.univ));
    const safe = favResults.filter(r => r.band && r.band.label === '안정').length;
    const fit = favResults.filter(r => r.band && r.band.label === '적정').length;
    const bold = favResults.filter(r => r.band && r.band.label === '소신').length;

    if (favResults.length > 0) {
      html += `<div style="padding:12px;background:var(--cream);border-radius:10px;font-size:13px;margin-bottom:10px">
        포트폴리오 구성: 안정 ${safe}교 / 적정 ${fit}교 / 소신·상향 ${bold}교 —
        ${safe >= 1 && fit >= 1 ? '균형 잡힌 구성입니다.' : '안정권 대학 추가를 권장합니다.'}
      </div>`;

      favResults.forEach(r => {
        const comp = calcCompositeScore(r, student, analysis);
        const pColor = comp.probability >= 70 ? 'var(--green)' : comp.probability >= 45 ? 'var(--blue)' : comp.probability >= 30 ? 'var(--orange)' : 'var(--red)';
        const b = r.band || { label: '-', color: 'var(--muted)' };
        html += `<div class="match-row" onclick="showUnivDetail('${esc(r.univ)}')">
          <span class="match-badge ${b.cls || ''}">${b.label}</span>
          <div class="match-body">
            <div class="univ">${esc(r.univ)}</div>
            <div class="jeon">${esc(r.jeonType)} · ${r.score.toFixed(2)}등급${comp.comboUsed ? ' · 반영: ' + comp.comboUsed : ''}</div>
            ${comp.bandReason ? `<div style="font-size:10px;color:var(--teal);margin-top:2px">판정 근거: ${esc(comp.bandReason)}</div>` : ''}
          </div>
          <div class="match-num">
            <div>${bandBadge(comp.band, comp.bandNoCutLabel, comp)}</div>
            <div class="unit">구간 판정</div>
          </div>
        </div>`;
      });

      const avgProb = Math.round(favResults.reduce((s, r) => s + calcCompositeScore(r, student, analysis).probability, 0) / favResults.length);
      html += `<div style="margin-top:10px;padding:10px 14px;background:var(--teal-light);border-radius:10px;font-size:13px;text-align:center">
        포트폴리오 평균 합격 확률: <strong style="color:var(--teal);font-size:18px">${avgProb}%</strong>
        ${avgProb >= 55 ? ' — 긍정적 전망' : avgProb >= 35 ? ' — 보통 전망 (안정권 추가 권장)' : ' — 도전적 구성 (안정권 추가 필수)'}
      </div>`;
    }
    html += '</div>';
  }

  el.innerHTML = html;

  // 카드 보드 3종 렌더 (수도권 매칭 / 컷라인 비교 / 전체 환산 결과)
  initCardBoard('realmatch', student, { onlyWithCut: true });
  initCardBoard('cutcmp', student, { onlyWithCut: true });
  initCardBoard('allresults', student, {});
  renderCardBoard('realmatch');
  renderCardBoard('cutcmp');
  renderCardBoard('allresults');
}

function filterUnivResults() {
  const q = document.getElementById('univSearch').value.toLowerCase();
  document.querySelectorAll('.univ-row').forEach(row => {
    const univ = row.dataset.univ.toLowerCase();
    row.style.display = (!q || univ.includes(q)) ? '' : 'none';
  });
  updateUnivCount();
}

function sortUnivResults(btn, sortBy) {
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const tbody = document.getElementById('univTableBody');
  const rows = [...tbody.querySelectorAll('.univ-row')];
  rows.sort((a, b) => {
    if (sortBy === 'prob') return parseFloat(b.dataset.prob||0) - parseFloat(a.dataset.prob||0);
    if (sortBy === 'score') return parseFloat(a.dataset.score) - parseFloat(b.dataset.score);
    if (sortBy === 'name') return a.dataset.univ.localeCompare(b.dataset.univ);
    if (sortBy === 'reliability') {
      const order = {high:0, medium:1, low:2, none:3};
      return (order[a.dataset.rel]||3) - (order[b.dataset.rel]||3);
    }
    return 0;
  });
  rows.forEach(r => tbody.appendChild(r));
}

function filterUnivBand(btn, filter) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.univ-row').forEach(row => {
    if (filter === 'all') { row.style.display = ''; return; }
    if (filter === 'cutline') { row.style.display = CUTLINES.some(c => c.univ === row.dataset.univ) ? '' : 'none'; return; }
    if (filter === 'high') { row.style.display = row.dataset.rel === 'high' ? '' : 'none'; return; }
    if (filter === 'interview') { row.style.display = row.dataset.hasint === 'true' ? '' : 'none'; return; }
  });
  updateUnivCount();
}

function updateUnivCount() {
  const visible = document.querySelectorAll('.univ-row:not([style*="display: none"])').length;
  const el = document.getElementById('univCount');
  if (el) el.textContent = visible;
}

let _rankSortCol = null, _rankSortAsc = true;
function sortStudentRank(col) {
  const tbody = document.getElementById('studentRankBody');
  if (!tbody) return;
  if (_rankSortCol === col) _rankSortAsc = !_rankSortAsc;
  else { _rankSortCol = col; _rankSortAsc = true; }

  document.querySelectorAll('.rank-sort-arrow').forEach(el => {
    el.textContent = el.dataset.col === col ? (_rankSortAsc ? '▲' : '▼') : '';
  });

  const rows = [...tbody.querySelectorAll('tr')];
  rows.sort((a, b) => {
    let va, vb;
    if (col === 'name' || col === 'concept') {
      va = a.dataset[col] || ''; vb = b.dataset[col] || '';
      return _rankSortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    }
    va = parseFloat(a.dataset[col.toLowerCase()] || 0);
    vb = parseFloat(b.dataset[col.toLowerCase()] || 0);
    if (col === 'avg' || col === 'bestcomboscore' || col === 'trenddir' || col === 'seat') {
      return _rankSortAsc ? va - vb : vb - va;
    }
    return _rankSortAsc ? vb - va : va - vb;
  });
  rows.forEach(r => tbody.appendChild(r));
}

// ═══════════════════════════════════════════════
// WHAT-IF GRADE SIMULATION
// ═══════════════════════════════════════════════
function runWhatIf(sliderVal) {
  const delta = parseInt(sliderVal) / 10;
  const label = document.getElementById('whatifLabel');
  const resultDiv = document.getElementById('whatifResult');
  if (!label || !resultDiv) return;

  if (delta === 0) {
    label.textContent = '현재';
    label.style.color = 'var(--teal)';
    resultDiv.style.display = 'none';
    return;
  }

  const sign = delta > 0 ? '+' : '';
  label.textContent = sign + delta.toFixed(1) + '등급';
  label.style.color = delta < 0 ? 'var(--green)' : 'var(--red)';

  const student = STUDENTS[selectedIdx];
  const analysis = ANALYSIS[student.seat] || {};
  const results = runAllUniversities(student);

  const currentComps = results.map(r => {
    const comp = calcCompositeScore(r, student, analysis);
    return { univ: r.univ, jeonType: r.jeonType, prob: comp.probability, score: r.score, cutline: r.cutline, comp, r };
  }).sort((a, b) => b.prob - a.prob);

  const simComps = results.map(r => {
    const simScore = r.score + delta;
    const simResult = { ...r, score: simScore };
    if (r.cutline) {
      simResult.diff = simScore - r.cutline.cut;
    }
    const comp = calcCompositeScore(simResult, student, analysis);
    return { univ: r.univ, jeonType: r.jeonType, prob: comp.probability, score: simScore, comp };
  }).sort((a, b) => b.prob - a.prob);

  const currentSafe = currentComps.filter(r => r.prob >= 65).length;
  const simSafe = simComps.filter(r => r.prob >= 65).length;
  const currentFit = currentComps.filter(r => r.prob >= 40 && r.prob < 65).length;
  const simFit = simComps.filter(r => r.prob >= 40 && r.prob < 65).length;

  let currentPort = null, simPort = null;
  if (currentComps.length >= 6) {
    currentPort = calcOptimalPortfolio(currentComps, 6);
    simPort = calcOptimalPortfolio(simComps, 6);
  }

  let html = '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px">';
  html += `<div style="padding:8px;background:var(--card);border-radius:8px;text-align:center">
    <div style="font-size:10px;color:var(--muted)">안정권 (65%+)</div>
    <div class="mono" style="font-size:14px">${currentSafe} → <strong style="color:${simSafe > currentSafe ? 'var(--green)' : simSafe < currentSafe ? 'var(--red)' : 'var(--sub)'}">${simSafe}교</strong></div>
  </div>`;
  html += `<div style="padding:8px;background:var(--card);border-radius:8px;text-align:center">
    <div style="font-size:10px;color:var(--muted)">적정 (40~64%)</div>
    <div class="mono" style="font-size:14px">${currentFit} → <strong style="color:${simFit > currentFit ? 'var(--green)' : simFit < currentFit ? 'var(--red)' : 'var(--sub)'}">${simFit}교</strong></div>
  </div>`;
  html += '</div>';

  if (currentPort && simPort) {
    const diffAtLeast = simPort.atLeastOne - currentPort.atLeastOne;
    const diffLabel = diffAtLeast > 0 ? '+' + diffAtLeast : '' + diffAtLeast;
    html += `<div style="text-align:center;margin-bottom:8px">
      포트폴리오 합격 확률: <span class="mono">${currentPort.atLeastOne}%</span> → <strong class="mono" style="color:${diffAtLeast > 0 ? 'var(--green)' : diffAtLeast < 0 ? 'var(--red)' : 'var(--sub)'}">${simPort.atLeastOne}% (${diffLabel}%p)</strong>
    </div>`;
  }

  // Top changed universities
  const changes = currentComps.map(c => {
    const sim = simComps.find(s => s.univ === c.univ);
    return { univ: c.univ, jeon: c.jeonType, current: c.prob, sim: sim ? sim.prob : c.prob, diff: sim ? sim.prob - c.prob : 0 };
  }).filter(c => Math.abs(c.diff) >= 3).sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff)).slice(0, 5);

  if (changes.length > 0) {
    html += '<div style="font-size:11px;font-weight:600;margin-bottom:4px">주요 변화 대학</div>';
    changes.forEach(c => {
      const color = c.diff > 0 ? 'var(--green)' : 'var(--red)';
      const sign = c.diff > 0 ? '+' : '';
      html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:11px">${esc(c.univ)} <span style="color:var(--muted);font-size:10px">${esc((c.jeon||'').substring(0,4))}</span></span>
        <span class="mono" style="font-size:11px">${c.current}% → <strong style="color:${color}">${c.sim}% (${sign}${c.diff}%p)</strong></span>
      </div>`;
    });
  }

  resultDiv.innerHTML = html;
  resultDiv.style.display = 'block';
}

// ═══════════════════════════════════════════════
// UNIVERSITY DETAIL MODAL
// ═══════════════════════════════════════════════
// ═══════════════════════════════════════════════
// 어디가 학과별 합격선 조회 엔진 ("대학명|학과명" 키)
// ═══════════════════════════════════════════════
function _median(arr) {
  if (!arr.length) return null;
  const s = [...arr].sort((a,b) => a-b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
}
function _deptNorm(n) {
  return String(n||'').replace(/\(.*?\)/g,'').replace(/(학과|학부|전공|계열|과)$/,'').replace(/\s/g,'');
}

// 학생에게 맞는 학과 컷 선택: 추천학과 매칭 우선, 없으면 계열 중앙값
// 등급50/70 결측 폴백 분류 (어디가 학과별 컷 레코드 단위)
// - g70 존재 → 정상(70%컷 기준)
// - g70만 결측 → 등급50 기반 판정 + '70컷 정보 없음' 플래그
// - 둘 다 결측 → 판정 불가지만 목록에서 제외하지 않고 경쟁률 참고 표시
function deptCutFallback(e) {
  const cut = e.g70 != null ? e.g70 : (e.g50 != null ? e.g50 : null);
  if (cut == null) return { mode: 'no-cut', cut: null, label: `컷 정보 없음 — 경쟁률 ${e.ratio ?? '?'}:1 참고` };
  if (e.g70 == null) return { mode: 'g50-fallback', cut, flag: '70컷 정보 없음' };
  return { mode: 'g70', cut };
}

// ═══════════════════════════════════════════════
// 4구간 최종 판정 (안정/적정/소신/상향)
// ═══════════════════════════════════════════════
// 근거·경계 정의:
//  - 비교 대상: 학생 전과목 단위가중 평균등급 s (STEP 1에서 어디가 컷과 동일한
//    1~9 등급 스케일로 통일한 수치) vs 어디가 공시 등록자 컷 등급50/등급70.
//  - 어디가 데이터에서 등급50(등록자 상위 50% 컷)은 수치가 낮고(우수),
//    등급70(상위 70% 컷)은 수치가 높다(관대). 즉 g50 ≤ g70.
//  - 문언 규칙("등급70보다 유리→안정, 등급50~70 사이→적정, 등급50 근처 ±0.2→소신,
//    등급50보다 불리→상향")을 그대로 겹치지 않게 순차 적용하면 '안정' 조건이
//    '적정' 구간을 포함해 버리므로, 좁은 구간 우선·보수(안전) 방향으로 아래처럼
//    비중복 사다리로 확정한다 (±0.2는 컷 경계의 연도별 변동 완충폭):
//      1. 안정: s < g50            — 더 엄격한 컷(등록자 중위값)보다도 유리
//      2. 적정: g50 ≤ s ≤ g70      — 등록자 분포(50~70% 컷) 안
//      3. 소신: g70 < s ≤ g70+0.2  — 관대한 컷 근처(±0.2 완충)의 불리한 쪽
//      4. 상향: s > g70 + 0.2      — 컷 완충 범위 밖으로 불리
//  - 등급70 결측 시 등급50만으로(g70=g50 취급, STEP 5의 '70컷 정보 없음' 플래그 유지),
//    등급50 결측 시 등급70만으로 판정한다.
//  - 둘 다 결측이면 판정하지 않는다(null 반환) — '컷 정보 없음 — 경쟁률 참고' 표시 유지.
// cw(충원배수 = 추합 ÷ 모집인원)를 넘기면 충원 보정을 적용한 구간을 반환한다.
// ── 충원배수 보정 발동 기준·근거 ──
//  - 발동 기준: cw ≥ 1.0 (추가합격 인원이 모집인원 이상 = 예비번호가 최소 1배수 소진)
//  - 근거: 어디가 공시 등급50/70은 '등록자' 컷이지만, 충원이 1배수 이상 도는 학과는
//    최초 합격선보다 실질 합격선이 한 배수만큼 아래(수치상 높은 등급)까지 내려간다.
//    따라서 컷 경계 부근 판정을 한 단계 유리하게 본다: 소신→적정, 적정→안정.
//  - 안정은 그대로(더 올릴 단계 없음), 상향은 보정하지 않는다(컷 완충 밖 미달은
//    충원으로 뒤집힌다는 데이터 근거가 없으므로 보수 유지).
//  - cw가 null(추합·모집인원 결측 또는 모집인원 0 — 전체의 약 14%)이면 보정하지 않는다.
function classifyBand(s, g50, g70, cw) {
  if (s == null || isNaN(s)) return null;
  if (g50 == null && g70 == null) return null;   // 컷 정보 없음 → 4구간 판정 강제하지 않음
  // 어디가 원자료에 등급50 > 등급70인 역전 레코드가 3.6% 존재(공시 특성)하므로
  // min/max로 정규화해 사다리의 전제(엄격컷 ≤ 관대컷)를 항상 보장한다
  const a = g50 != null ? g50 : g70, b = g70 != null ? g70 : g50;
  const lo = Math.min(a, b);                      // 엄격한 컷 (수치 작음)
  const hi = Math.max(a, b);                      // 관대한 컷 (수치 큼)
  let band;
  if (s < lo) band = '안정';
  else if (s <= hi) band = '적정';
  else if (s <= hi + 0.2) band = '소신';
  else band = '상향';
  if (cw != null && !isNaN(cw) && cw >= 1.0) {
    if (band === '소신') band = '적정';
    else if (band === '적정') band = '안정';
  }
  return band;
}
const BAND_STYLE = {
  '안정': { color: 'var(--green)',  emoji: '&#128994;' },
  '적정': { color: 'var(--blue)',   emoji: '&#128309;' },
  '소신': { color: 'var(--orange)', emoji: '&#128992;' },
  '상향': { color: 'var(--red)',    emoji: '&#128308;' },
};
// 추천 화면용 구간 배지 — 정밀 확률 수치 대신 표시. band null이면 '컷 정보 없음'
// comp를 넘기면 충원 보정 여부('충원 감안 시 X')와 충원배수를 함께 표시한다.
function bandBadge(band, noCutLabel, comp) {
  if (!band) {
    return `<span style="font-size:10px;color:var(--muted);font-weight:600">${esc(noCutLabel || '컷 정보 없음')}</span>`;
  }
  const st = BAND_STYLE[band] || BAND_STYLE['적정'];
  const label = (comp && comp.bandAdjusted) ? `충원 감안 시 ${band}` : band;
  let h = `<span style="display:inline-block;padding:2px 10px;border-radius:10px;font-weight:800;font-size:${comp && comp.bandAdjusted ? 11 : 13}px;color:#fff;background:${st.color}">${st.emoji} ${label}</span>`;
  if (comp && comp.cwMultiple != null) {
    h += `<div style="font-size:9px;color:var(--muted);margin-top:2px">충원 ${comp.cwMultiple.toFixed(1)}배수</div>`;
  }
  if (comp && comp.judgeReliability) {
    h += `<div style="margin-top:2px">${judgeRelBadge(comp.judgeReliability)}</div>`;
  }
  return h;
}

// 판정 신뢰도 배지 (빌드 단계 기준: 높음=컷·충원·모집 완비 & 모집 10명↑ / 보통=일부 결측·소수모집 / 낮음=컷 결측)
const JUDGE_REL_COLOR = { '높음': 'var(--green)', '보통': 'var(--orange)', '낮음': 'var(--red)' };
function judgeRelBadge(rel) {
  if (!rel) return '';
  const c = JUDGE_REL_COLOR[rel] || 'var(--muted)';
  return `<span style="font-size:9px;padding:1px 6px;border-radius:8px;border:1px solid ${c};color:${c};font-weight:700;white-space:nowrap">신뢰도: ${rel}</span>`;
}

function getDeptCutline(univName, student, analysis, jeonType) {
  const depts = UNIV_DEPTS[univName];
  if (!depts || !depts.length) return null;
  const a = analysis || ANALYSIS[student.seat] || {};
  const ra = analyzeRecord(student, a);
  const track = getStudentTrack(student, a);
  const jt = (jeonType||'').includes('종합') ? '종합' : (jeonType||'').includes('논술') ? '논술' : '교과';
  const wanted = (ra.deptMatch||[]).map(_deptNorm).filter(Boolean);
  const matchedCuts = [], trackCuts = [], anyCuts = [];
  const matched50 = [], matched70 = [], track50 = [], track70 = [], any50 = [], any70 = [];
  const matchedCw = [], trackCw = [], anyCw = [];   // 충원배수 (추합÷모집인원)
  const matchedRel = [], trackRel = [], anyRel = []; // 판정 신뢰도 (빌드 단계 산출: 높음/보통/낮음)
  let matchedName = null;
  let no70Used = 0;            // 등급50 폴백으로 판정한 레코드 수
  const noCutRatios = [];      // 둘 다 결측 레코드의 경쟁률 (판정불가 참고용)
  for (const d of depts) {
    const entries = DEPT_CUTLINES[univName + '|' + d] || [];
    const dn = _deptNorm(d);
    const isMatch = wanted.some(w => w && (dn.includes(w) || w.includes(dn)));
    for (const e of entries) {
      if (e.jt && e.jt !== jt) continue;
      const fb = deptCutFallback(e);
      if (fb.mode === 'no-cut') {
        const rr = parseFloat(e.ratio);
        if (!isNaN(rr)) noCutRatios.push(rr);
        continue;
      }
      if (fb.mode === 'g50-fallback') no70Used++;
      const cut = fb.cut;
      if (isMatch) {
        matchedCuts.push(cut); if (!matchedName) matchedName = d;
        if (e.g50 != null) matched50.push(e.g50);
        if (e.g70 != null) matched70.push(e.g70);
        if (e.cw != null) matchedCw.push(e.cw);
        if (e.rel) matchedRel.push(e.rel);
      }
      if (!e.gy || e.gy === track || e.gy === '통합' || e.gy === '공통') {
        trackCuts.push(cut);
        if (e.g50 != null) track50.push(e.g50);
        if (e.g70 != null) track70.push(e.g70);
        if (e.cw != null) trackCw.push(e.cw);
        if (e.rel) trackRel.push(e.rel);
      }
      if (e.gy !== '예체능') {
        anyCuts.push(cut);
        if (e.g50 != null) any50.push(e.g50);
        if (e.g70 != null) any70.push(e.g70);
        if (e.cw != null) anyCw.push(e.cw);
        if (e.rel) anyRel.push(e.rel);
      }
    }
  }
  const no70 = no70Used > 0;
  // 4구간 판정용 등급50/등급70 중앙값 (선택된 버킷과 동일한 우선순위: 매칭학과 > 계열 > 전체)
  // 버킷 판정 신뢰도: 기여 레코드들의 등급 중 가장 보수적인 값 (낮음 < 보통 < 높음)
  const _relRank = { '낮음': 0, '보통': 1, '높음': 2 };
  const _relAgg = rels => rels.length ? rels.reduce((a, b) => (_relRank[b] < _relRank[a] ? b : a)) : null;
  const _mk = (cuts, g50s, g70s, cws, rels, extra) => Object.assign({
    cut: Math.round(_median(cuts)*100)/100,
    g50: g50s.length ? Math.round(_median(g50s)*100)/100 : null,
    g70: g70s.length ? Math.round(_median(g70s)*100)/100 : null,
    cw: cws.length ? Math.round(_median(cws)*100)/100 : null,
    rel: _relAgg(rels),
    jt, no70, no70Used
  }, extra);
  if (matchedCuts.length) return _mk(matchedCuts, matched50, matched70, matchedCw, matchedRel, { dept: matchedName, n: matchedCuts.length, matched: true });
  if (trackCuts.length) return _mk(trackCuts, track50, track70, trackCw, trackRel, { dept: null, n: trackCuts.length, matched: false });
  if (anyCuts.length) return _mk(anyCuts, any50, any70, anyCw, anyRel, { dept: null, n: anyCuts.length, matched: false, crossTrack: true });
  // 등급 있는 레코드가 하나도 없음 → 판정 불가 (경쟁률 참고값과 함께 반환, 제외하지 않음)
  if (noCutRatios.length) {
    const ratioRef = Math.round(_median(noCutRatios) * 10) / 10;
    return { cut: null, noCut: true, ratioRef, n: noCutRatios.length, dept: null, matched: false, jt,
             rel: '낮음',  // 등급50·70 모두 결측 → 판정 신뢰도 낮음
             label: `컷 정보 없음 — 경쟁률 ${ratioRef}:1 참고` };
  }
  return null;
}

// ═══════════════════════════════════════════════
// 학과별 합격선 추이 (최근 3개년) — 상승/하락/변동성
// ═══════════════════════════════════════════════
// series: [{year, cut}] (연도 오름차순). cut=등급(낮을수록 입결 상승/경쟁 심화)
// 반환: { insufficient?, points, years, direction, volatility, slope, stdev, spread, label, cls }
function calcCutlineTrend(series) {
  if (!Array.isArray(series)) return { insufficient: true, reason: 'no-data' };
  const pts = series.filter(p => p && p.cut != null).sort((a, b) => a.year - b.year);
  if (pts.length < 2) return { insufficient: true, points: pts.length, reason: 'need-2yrs' };

  const cuts = pts.map(p => p.cut);
  const first = pts[0], last = pts[pts.length - 1];
  const yrSpan = (last.year - first.year) || 1;
  const slope = (last.cut - first.cut) / yrSpan; // 등급/년 (+면 등급↑=입결 완화, -면 입결 상승)

  const mean = cuts.reduce((s, v) => s + v, 0) / cuts.length;
  const variance = cuts.reduce((s, v) => s + (v - mean) ** 2, 0) / cuts.length;
  const stdev = Math.sqrt(variance);
  const spread = Math.max(...cuts) - Math.min(...cuts);

  // 방향: 합격선(입결) 관점 — cut 감소 = 입결 상승세(경쟁 심화)
  let direction;
  if (slope <= -0.15) direction = '입결 상승세';
  else if (slope >= 0.15) direction = '입결 하락세';
  else direction = '유지';

  // 변동성
  let volatility, cls;
  if (stdev <= 0.15) { volatility = '안정적'; cls = 'trend-stable'; }
  else if (stdev <= 0.40) { volatility = '보통'; cls = 'trend-mid'; }
  else { volatility = '변동 큼'; cls = 'trend-volatile'; }

  const dirShort = direction === '입결 상승세' ? '↑상승' : direction === '입결 하락세' ? '↓하락' : '→유지';
  const label = `${volatility} · ${dirShort}`;

  return {
    insufficient: false,
    points: pts.length,
    years: pts.map(p => p.year),
    series: pts,
    direction, volatility,
    slope: Math.round(slope * 100) / 100,
    stdev: Math.round(stdev * 100) / 100,
    spread: Math.round(spread * 100) / 100,
    label, cls
  };
}

// 학과의 연도별 컷라인 시리즈 조회 → 추이 계산
// univName: 대학명, dept: 학과명(선택), student: 계열/전형유형 판정용
function getDeptTrend(univName, dept, student, jeonType) {
  const track = student ? getStudentTrack(student, ANALYSIS[student.seat] || {}) : null;
  const jt = (jeonType || '').includes('종합') ? '종합' : (jeonType || '').includes('논술') ? '논술' : '교과';
  // 계열 우선순위: 학생 계열 → 인문 → 자연 → 통합
  const gyeolOrder = [track, '인문', '자연', '통합'].filter(Boolean);
  for (const gy of gyeolOrder) {
    const key = `${univName}|${gy}|${jt}`;
    const series = YEAR_CUTLINES[key];
    if (series && series.length >= 2) {
      const trend = calcCutlineTrend(series);
      trend.gyeol = gy; trend.jt = jt;
      return trend;
    }
  }
  // 전형유형 무관 폴백
  for (const gy of gyeolOrder) {
    for (const j of ['교과', '종합', '논술']) {
      const series = YEAR_CUTLINES[`${univName}|${gy}|${j}`];
      if (series && series.length >= 2) {
        const trend = calcCutlineTrend(series);
        trend.gyeol = gy; trend.jt = j; trend.fallback = true;
        return trend;
      }
    }
  }
  return { insufficient: true, reason: 'no-series' };
}

// 추이 배지 HTML
function trendBadge(trend) {
  if (!trend || trend.insufficient) return '';
  const color = trend.cls === 'trend-stable' ? 'var(--green)' : trend.cls === 'trend-mid' ? 'var(--blue)' : 'var(--orange)';
  const yrs = trend.years.join('→');
  return `<span class="trend-badge ${trend.cls}" title="${yrs} 합격선 ${trend.series.map(p=>p.cut).join('→')}등급 · σ${trend.stdev}">${esc(trend.label)}</span>`;
}

// 신뢰도 배지: "신뢰도: 높음(표본 N개)" — ADM_RESULTS 표본 수 기반
function confBadge(univName) {
  const c = UNIV_CONFIDENCE[univName];
  if (!c) return '';
  const cls = c.grade === '높음' ? 'conf-high' : c.grade === '보통' ? 'conf-mid' : 'conf-low';
  return `<span class="conf-badge ${cls}" title="ADM_RESULTS 표본 ${c.samples}개">신뢰도: ${c.grade}(표본 ${c.samples}개)</span>`;
}

// 요인별 기여도 breakdown 텍스트: "내신 40% + 생기부매칭 25% + ..."
function factorBreakdownText(comp, topN) {
  if (!comp || !comp.factorBreakdown) return '';
  const fb = comp.factorBreakdown.filter(f => f.pct > 0).sort((a, b) => b.pct - a.pct);
  const shown = topN ? fb.slice(0, topN) : fb;
  return shown.map(f => `${f.key} ${f.pct}%`).join(' + ');
}

// 컷 대비 등급차 → 확률 (전형유형별 곡선, 컷라인 분기와 동일 모양)
function cutCurveProb(diff, is종합, is논술) {
  // 백테스트 재보정 가중치 적용: 전형유형별 offset만큼 diff를 이동 (offset>0 → 관대)
  const jt = is종합 ? '종합' : is논술 ? '논술' : '교과';
  const offset = (COMPOSITE_WEIGHTS && COMPOSITE_WEIGHTS[jt] && typeof COMPOSITE_WEIGHTS[jt].offset === 'number')
    ? COMPOSITE_WEIGHTS[jt].offset : 0;
  const d = diff - offset;
  if (is종합) {
    if (d <= -2.0) return 92;
    if (d >= 3.0) return 8;
    return interpolateAnchors(d, [
      [-2.0,92],[-1.5,85],[-1.0,75],[-0.5,64],[-0.2,56],[0,48],[0.3,40],[0.5,34],[1.0,24],[1.5,17],[2.0,12],[3.0,8]
    ], 8);
  }
  if (is논술) {
    if (d <= -2.0) return 82;
    if (d >= 3.0) return 12;
    return interpolateAnchors(d, [
      [-2.0,82],[-1.5,74],[-1.0,65],[-0.5,56],[-0.2,50],[0,45],[0.3,40],[0.5,36],[1.0,28],[1.5,22],[2.0,17],[3.0,12]
    ], 12);
  }
  if (d <= -2.0) return 98;
  if (d >= 3.0) return 3;
  return interpolateAnchors(d, [
    [-2.0,98],[-1.5,95],[-1.0,88],[-0.5,75],[-0.2,63],[0,50],[0.3,36],[0.5,27],[1.0,16],[1.5,10],[2.0,6],[3.0,3]
  ], 3);
}
