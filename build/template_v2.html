  const highStudents = rows.filter(x => x.atLeastOne >= 95).length;

  r += `<div class="stat-row">
<div class="stat-card"><div class="num">${avgAll.toFixed(2)}</div><div class="lbl">학급 평균등급</div></div>
<div class="stat-card"><div class="num">${STUDENTS.length}</div><div class="lbl">총 학생 수</div></div>
<div class="stat-card"><div class="num">${safeTotal}</div><div class="lbl">안정권 지원 총합</div></div>
<div class="stat-card"><div class="num risk-safe">${highStudents}</div><div class="lbl">안정 학생 (95%+)</div></div>
<div class="stat-card"><div class="num risk-warn">${warnStudents}</div><div class="lbl">주의 학생 (<60%)</div></div>
</div>`;

  r += `<h2>전체 학생 종합 현황</h2>
<table>
<tr><th>번호</th><th>이름</th><th>평균</th><th>최적조합</th><th>추세</th><th>적합성</th><th>진로</th><th>추천전형</th><th>안정/적정</th><th>위험도</th><th>합격률</th><th>TOP 3 대학</th></tr>`;

  rows.forEach(s => {
    const gc = s.avg <= 2 ? '#143A40' : s.avg <= 3 ? '#2E7D4A' : s.avg <= 4 ? '#3C6E71' : s.avg <= 5 ? '#C77B3C' : '#c62828';
    const tArrow = s.trendDir < -0.3 ? '↑' + Math.abs(s.trendDir).toFixed(1) : s.trendDir > 0.3 ? '↓' + s.trendDir.toFixed(1) : '→';
    const tCls = s.trendDir < -0.3 ? 'trend-up' : s.trendDir > 0.3 ? 'trend-down' : 'trend-flat';
    const fitC = s.fit >= 60 ? '#2E7D4A' : s.fit >= 35 ? '#3C6E71' : '#C77B3C';
    const riskCls = s.riskLevel === '안정적' ? 'risk-safe' : s.riskLevel === '균형' || s.riskLevel === '보통' ? 'risk-ok' : s.riskLevel === '주의' ? 'risk-warn' : 'risk-danger';
    const top3Str = s.top3.map(t => `${t.univ.length > 5 ? t.univ.substring(0,5)+'..' : t.univ}(${t.prob}%)`).join(', ');

    r += `<tr>
<td style="text-align:center;font-weight:600">${s.seat}</td>
<td style="font-weight:600">${s.name}</td>
<td class="mono" style="font-weight:700;color:${gc}">${s.avg.toFixed(2)}</td>
<td style="font-size:9px"><span class="mono" style="font-weight:600">${s.bestScore < 99 ? s.bestScore.toFixed(2) : '-'}</span> ${s.bestCombo ? s.bestCombo.substring(0,4) : ''}</td>
<td class="${tCls}" style="text-align:center;font-weight:700">${tArrow}</td>
<td style="text-align:center;font-weight:700;color:${fitC}">${s.fit}</td>
<td>${s.concept}</td>
<td style="font-size:9px">${s.bestType}전형</td>
<td style="text-align:center"><span class="safe">${s.safeCount}</span>/<span class="fit">${s.fitCount}</span></td>
<td class="${riskCls}" style="font-weight:700">${s.riskLevel}</td>
<td class="mono" style="font-weight:700">${s.atLeastOne}%</td>
<td style="font-size:9px">${top3Str}</td>
</tr>`;
  });
  r += '</table>';

  r += '<h2>상담 우선 학생 목록</h2>';
  const priority = [];
  rows.forEach(s => {
    const reasons = [];
    if (s.trendDir > 1.0) reasons.push('성적 하락 ' + s.trendDir.toFixed(1) + '등급');
    if (s.fit < 30) reasons.push('적합성 낮음 ' + s.fit + '점');
    if (s.concept === '-') reasons.push('진로 미설정');
    if (s.atLeastOne < 60) reasons.push('합격률 주의 ' + s.atLeastOne + '%');
    if (s.safeCount === 0) reasons.push('안정권 없음');
    if (reasons.length > 0) priority.push({...s, reasons});
  });
  if (priority.length > 0) {
    r += '<table><tr><th>번호</th><th>이름</th><th>평균</th><th>주의 사유</th><th>권장 조치</th></tr>';
    priority.forEach(s => {
      const action = s.safeCount === 0 ? '안정권 대학 추가 검토' : s.concept === '-' ? '진로 탐색 상담' : s.fit < 30 ? '전공적합성 보완 방안 상담' : '추이 관찰 및 면담';
      r += `<tr><td style="text-align:center">${s.seat}</td><td style="font-weight:600">${s.name}</td><td class="mono">${s.avg.toFixed(2)}</td><td style="color:#C77B3C">${s.reasons.join(', ')}</td><td style="font-size:9px">${action}</td></tr>`;
    });
    r += '</table>';
  } else {
    r += '<div style="font-size:11px;color:#999;margin:8px 0">특별히 우선 상담이 필요한 학생이 없습니다.</div>';
  }

  r += `<div class="footer">2027학년도 수시 상담 프로그램 · 병점고등학교 3학년 4반 · 학생 데이터는 브라우저 내에서만 처리되며 외부로 전송되지 않습니다</div>
</body></html>`;

  const w = window.open('', '_blank');
  w.document.write(r);
  w.document.close();
  w.focus();
  setTimeout(() => w.print(), 500);
}

// ═══════════════════════════════════════════════
// EVENT HANDLERS
// ═══════════════════════════════════════════════

// Sidebar student click
document.getElementById('roster').addEventListener('click', e => {
  const btn = e.target.closest('.student-btn');
  if (!btn) return;
  selectStudent(parseInt(btn.dataset.idx));
});

// Search
document.getElementById('searchInput').addEventListener('input', e => {
  filterRoster(e.target.value);
});

// Tab switching
document.getElementById('tabBar').addEventListener('click', e => {
  if (!e.target.classList.contains('tab-btn')) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById('panel-' + e.target.dataset.tab).classList.add('active');
  currentTab = e.target.dataset.tab;
});

// Home button
document.getElementById('homeBtn').addEventListener('click', () => {
  renderDashboard();
  renderRoster();
});

function downloadFile() {
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '수시상담프로그램_2027_병점고3-4.html';
  a.click();
  URL.revokeObjectURL(a.href);
}

// Mobile menu
document.getElementById('menuToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
});
document.getElementById('sidebarOverlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
});

// Modal close on overlay click
document.getElementById('univModal').addEventListener('click', e => {
  if (e.target === document.getElementById('univModal')) closeUnivModal();
});
document.getElementById('compareModal').addEventListener('click', e => {
  if (e.target === document.getElementById('compareModal')) document.getElementById('compareModal').classList.remove('open');
});

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeUnivModal(); document.getElementById('compareModal').classList.remove('open'); return; }

  // Focus search: / (not ?) or Ctrl+K
  if (((e.key === '/' && !e.shiftKey) || (e.ctrlKey && e.key === 'k')) && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
    return;
  }

  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  // Arrow up/down: navigate students
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const dir = e.key === 'ArrowDown' ? 1 : -1;
    const next = (selectedIdx ?? -1) + dir;
    if (next >= 0 && next < STUDENTS.length) selectStudent(next);
  }

  // Tab switching: 1-4
  const tabs = ['score', 'susi', 'record', 'memo'];
  if (e.key >= '1' && e.key <= '4' && selectedIdx != null) {
    e.preventDefault();
    const tabName = tabs[parseInt(e.key) - 1];
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    const btn = document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
    if (btn) { btn.classList.add('active'); document.getElementById('panel-' + tabName).classList.add('active'); currentTab = tabName; }
  }

  // H: go to dashboard
  if (e.key === 'h' || e.key === 'H') { renderDashboard(); renderRoster(); }

  // ?: show keyboard shortcuts
  if (e.key === '?') {
    const helpEl = document.getElementById('kbHelp');
    if (helpEl) helpEl.style.display = helpEl.style.display === 'none' ? '' : 'none';
  }
});

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
renderRoster();

// Restore last selection or show dashboard
const savedIdx = localStorage.getItem('susi27_last');
if (savedIdx != null && STUDENTS[savedIdx]) {
  selectStudent(parseInt(savedIdx));
} else {
  renderDashboard();
}
</script>
