// 수능 최저학력기준 충족 판정
// ═══════════════════════════════════════════════
// 학생 수능 등급 추출: 실제 데이터(student.suneung) 우선, 없으면 내신 핵심교과로 추정
function getSuneungGrades(student) {
  if (student && student.suneung && typeof student.suneung === 'object' && Object.keys(student.suneung).length) {
    return { grades: Object.assign({}, student.suneung), estimated: false };
  }
  const grades = {};
  try {
    const sa = calcSubjectAvgs(student);
    ['국어','수학','영어','사회','과학','한국사'].forEach(n => {
      const f = sa.find(s => s.name === n);
      if (f) grades[n] = Math.max(1, Math.min(9, Math.round(f.avg)));
    });
  } catch (e) {}
  return { grades, estimated: true };
}

// 최저기준 텍스트에서 학과별 조항 선택 ('/'로 구분된 다중 조항 대응)
function selectMinClause(minText, deptName) {
  if (!minText.includes('/')) return minText;
  const clauses = minText.split('/').map(s => s.trim());
  if (deptName) {
    const hit = clauses.find(c => c.includes(deptName) || (deptName.length >= 2 && c.includes(deptName.slice(0, 2))));
    if (hit) return hit;
  }
  // 학과 지정이 없거나 매칭 실패 → '학과명:' 접두어 없는 일반 조항 우선
  const general = clauses.find(c => !/^[가-힣A-Za-z·]+(과|부|학부|전공|계열)\s*[:：]/.test(c));
  return general || clauses[0];
}

// ★ 수능 최저학력기준 충족 판정
// student: 학생 객체(또는 {suneung:{국어,수학,영어,탐구,한국사}}), minSpec: 기준 문자열 또는 {min}, deptName: 학과(선택)
// 반환: { applicable, meets, required, usedAreas, sumHave, sumNeed, shortfall:[{area,...}], koreanHistory, estimated }
function checkMinRequirement(student, minSpec, deptName) {
  const rawText = (typeof minSpec === 'string') ? minSpec
    : (minSpec && (minSpec.min || minSpec.minText || minSpec.기준)) || '';
  const dept = deptName || (minSpec && (minSpec.dept || minSpec.jn)) || null;
  const trimmed = String(rawText).trim();
  if (!trimmed || /^(미적용|없음|무|x|X|—|-|없)$/.test(trimmed)) {
    return { applicable: false, meets: true, required: '수능최저 없음', usedAreas: [], shortfall: [], estimated: false };
  }

  const minText = selectMinClause(trimmed, dept);
  const sg = getSuneungGrades(student);
  const g = sg.grades;
  const estimated = sg.estimated;

  // 사용 가능한 영역 등급 (국/수/영/탐구). 탐구는 명시값 없으면 min(사회,과학)
  const areaDefs = ['국어', '수학', '영어', '탐구'];
  const avail = areaDefs.map(a => {
    let v = g[a];
    if (a === '탐구' && v == null) {
      const s = g['사회'], sc = g['과학'];
      if (s != null || sc != null) v = Math.min(s == null ? 9 : s, sc == null ? 9 : sc);
    }
    return (v != null) ? { area: a, grade: v } : null;
  }).filter(Boolean);

  // 한국사 부가조건
  let koreanHistory = null;
  const hm = minText.match(/한국사\s*(\d)\s*등급/);
  if (hm) {
    const need = parseInt(hm[1]);
    const have = g['한국사'];
    koreanHistory = { need, have, meets: (have == null) ? true : have <= need };
  }

  const byGrade = [...avail].sort((a, b) => a.grade - b.grade);
  let meets = true, required = minText, usedAreas = [], sumHave = null, sumNeed = null, shortfall = [];

  const mSum = minText.match(/(\d)\s*개\s*(?:영역\s*)?(?:등급\s*)?합\s*(\d+)/);
  const mArea = minText.match(/(\d)\s*개\s*영역\s*(\d)\s*등급/);
  const mSingle = !mSum && !mArea ? minText.match(/(\d)\s*등급\s*이내/) : null;

  if (mSum) {
    const count = parseInt(mSum[1]), total = parseInt(mSum[2]);
    required = `${count}개 등급 합 ${total} 이내`;
    if (byGrade.length < count) {
      meets = false;
      shortfall.push({ type: 'insufficient-areas', detail: `반영 영역 ${byGrade.length}개 < 필요 ${count}개` });
    } else {
      usedAreas = byGrade.slice(0, count);
      sumHave = usedAreas.reduce((s, a) => s + a.grade, 0);
      sumNeed = total;
      if (sumHave > total) {
        meets = false;
        shortfall.push({ type: 'sum-over', over: sumHave - total,
          detail: `상위 ${count}개 합 ${sumHave} > 기준 ${total} (${sumHave - total}등급 초과)`,
          areas: usedAreas.map(a => `${a.area} ${a.grade}등급`) });
      }
    }
  } else if (mArea) {
    const count = parseInt(mArea[1]), gradeMax = parseInt(mArea[2]);
    required = `${count}개 영역 ${gradeMax}등급 이내`;
    const qualify = avail.filter(a => a.grade <= gradeMax);
    usedAreas = qualify;
    if (qualify.length < count) {
      meets = false;
      shortfall.push({ type: 'area-count', detail: `${gradeMax}등급 이내 영역 ${qualify.length}개 < 필요 ${count}개`,
        areas: avail.map(a => `${a.area} ${a.grade}등급`) });
    }
  } else if (mSingle) {
    const gradeMax = parseInt(mSingle[1]);
    required = `1개 영역 ${gradeMax}등급 이내`;
    const best = byGrade[0];
    usedAreas = best ? [best] : [];
    if (!best || best.grade > gradeMax) {
      meets = false;
      shortfall.push({ type: 'single', detail: `최상위 영역 ${best ? best.grade : '-'}등급 > 기준 ${gradeMax}등급`,
        areas: best ? [`${best.area} ${best.grade}등급`] : [] });
    }
  } else {
    // 파싱 불가 — 판정 보류
    return { applicable: true, meets: null, required: minText, usedAreas: [], shortfall: [],
      note: '기준 형식을 자동 해석하지 못했습니다.', estimated };
  }

  // 한국사 조건 반영
  if (koreanHistory && !koreanHistory.meets) {
    meets = false;
    shortfall.push({ type: 'korean-history', detail: `한국사 ${koreanHistory.have}등급 > 기준 ${koreanHistory.need}등급` });
  }

  return { applicable: true, meets, required, usedAreas, sumHave, sumNeed, shortfall, koreanHistory, estimated,
    studentGrades: g };
}

// 최저기준 충족 판정 → 배지 HTML
function minReqBadge(student, minSpec, deptName) {
  const r = checkMinRequirement(student, minSpec, deptName);
  if (!r.applicable) {
    return `<span class="min-badge min-none" title="수능최저 없음">최저 없음</span>`;
  }
  if (r.meets === null) {
    return `<span class="min-badge min-unknown" title="${esc(r.required)}">최저 확인필요</span>`;
  }
  const est = r.estimated ? ' (추정)' : '';
  if (r.meets) {
    const areas = r.usedAreas.map(a => `${a.area}${a.grade}`).join('·');
    return `<span class="min-badge min-ok" title="${esc(r.required)} · ${esc(areas)}">✓ 최저 충족${est}</span>`;
  }
  const short = r.shortfall[0] ? r.shortfall[0].detail : '기준 미달';
  return `<span class="min-badge min-fail" title="${esc(r.required)} · ${esc(short)}">✗ 최저 미충족${est}</span>`;
}

function calcOptimalPortfolio(allComps, count) {
  const sorted = [...allComps].sort((a,b) => b.prob - a.prob);
  const picks = [];
  const used = new Set();

  const safe = sorted.filter(r => r.prob >= 65);
  const fit = sorted.filter(r => r.prob >= 40 && r.prob < 65);
  const reach = sorted.filter(r => r.prob >= 15 && r.prob < 40);

  const addPick = (pool, n, opts) => {
    let added = 0;
    for (const r of pool) {
      if (picks.length >= count || added >= n) break;
      if (used.has(r.univ)) continue;
      const sameTier = picks.filter(p => p.comp.tier === r.comp.tier).length;
      if (sameTier >= 3) continue;
      if (opts && opts.preferType) {
        const sameType = picks.filter(p => {
          const pt = p.comp.is논술 ? '논술' : p.comp.is종합 ? '종합' : '교과';
          return pt === opts.preferType;
        }).length;
        if (sameType >= 4) continue;
      }
      picks.push(r);
      used.add(r.univ);
      added++;
    }
  };

  const has종합 = sorted.some(r => r.comp.is종합);
  const has논술 = sorted.some(r => r.comp.is논술);

  if (safe.length >= 3 && fit.length >= 2) {
    addPick(safe, 3);
    addPick(fit, 2);
    addPick(reach, 1);
  } else if (safe.length >= 2) {
    addPick(safe, 2);
    addPick(fit, 2);
    addPick(reach, 2);
  } else {
    addPick(safe, safe.length);
    addPick(fit, 3);
    addPick(reach, 3 - safe.length);
  }

  // Fill remaining: prefer 전형 type diversity
  if (picks.length < count && (has종합 || has논술)) {
    const pickedTypes = new Set(picks.map(p => p.comp.is논술 ? '논술' : p.comp.is종합 ? '종합' : '교과'));
    if (!pickedTypes.has('종합') && has종합) {
      const 종합pool = sorted.filter(r => r.comp.is종합 && !used.has(r.univ));
      addPick(종합pool, 1);
    }
    if (!pickedTypes.has('논술') && has논술) {
      const 논술pool = sorted.filter(r => r.comp.is논술 && !used.has(r.univ));
      addPick(논술pool, 1);
    }
  }

  while (picks.length < count) {
    const next = sorted.find(r => !used.has(r.univ));
    if (!next) break;
    picks.push(next);
    used.add(next.univ);
  }

  picks.sort((a,b) => b.prob - a.prob);

  const probs = picks.map(p => p.prob / 100);
  const nonePassing = probs.reduce((acc, p) => acc * (1 - p), 1);
  const atLeastOne = Math.round((1 - nonePassing) * 100);
  const expectedCount = probs.reduce((s, p) => s + p, 0);

  const safeCount = picks.filter(p => p.prob >= 65).length;
  const fitCount = picks.filter(p => p.prob >= 40 && p.prob < 65).length;
  const reachCount = picks.filter(p => p.prob < 40).length;
  const typeBreakdown = {};
  picks.forEach(p => {
    const t = p.comp.is논술 ? '논술' : p.comp.is종합 ? '종합' : '교과';
    typeBreakdown[t] = (typeBreakdown[t] || 0) + 1;
  });

  let riskLevel, riskAdvice;
  if (safeCount >= 2 && fitCount >= 1) {
    riskLevel = '안정적';
    riskAdvice = '안정권 확보가 충분합니다. 남은 지원에서 상향 도전을 고려하세요.';
  } else if (safeCount >= 1 && fitCount >= 2) {
    riskLevel = '균형';
    riskAdvice = '안정과 도전이 적절히 배분되어 있습니다.';
  } else if (safeCount === 0 && fitCount >= 3) {
    riskLevel = '주의';
    riskAdvice = '안정권 대학이 없습니다. 합격 가능성이 높은 대학 1개 이상 포함을 권장합니다.';
  } else if (reachCount >= 4) {
    riskLevel = '위험';
    riskAdvice = '소신·도전 지원 비중이 매우 높습니다. 수시 미합격 시 정시 전환 전략이 필요합니다.';
  } else {
    riskLevel = '보통';
    riskAdvice = '전체적으로 무난한 구성이지만, 학생 상황에 맞는 세부 조정을 권장합니다.';
  }

  const dupUnivs = [];
  const univNameCount = {};
  picks.forEach(p => { univNameCount[p.univ] = (univNameCount[p.univ] || 0) + 1; });
  for (const [u, c] of Object.entries(univNameCount)) { if (c > 1) dupUnivs.push(u); }

  return { picks, atLeastOne, expectedCount, safeCount, fitCount, reachCount, typeBreakdown, riskLevel, riskAdvice, dupUnivs };
}

function calcAdmissionStrategy(student, analysis) {
  const avg = calcWeightedAvg(student);
  const trend = calcYearlyTrend(student);
  const records = student.records || [];
  const opinions = student.opinions || [];
  const a = analysis || {};

  // 1. 교과전형 적합도 — grades are nearly deterministic; stability & level matter most
  let 교과 = 0;
  // Grade level (aggressive scaling for realistic avg 3.5-8.5 range)
  if (avg <= 2.0) 교과 += 50;
  else if (avg <= 3.0) 교과 += 45;
  else if (avg <= 3.5) 교과 += 42;
  else if (avg <= 4.0) 교과 += 38;
  else if (avg <= 4.5) 교과 += 33;
  else if (avg <= 5.0) 교과 += 27;
  else if (avg <= 5.5) 교과 += 22;
  else if (avg <= 6.0) 교과 += 17;
  else if (avg <= 7.0) 교과 += 10;
  else 교과 += 5;

  // Grade stability — 교과전형 values consistency highly
  if (trend.length >= 3) {
    const avgs = trend.map(t => t.avg);
    const range = Math.max(...avgs) - Math.min(...avgs);
    if (range < 0.3) 교과 += 25;
    else if (range < 0.5) 교과 += 22;
    else if (range < 0.8) 교과 += 17;
    else if (range < 1.2) 교과 += 12;
    else if (range < 2.0) 교과 += 7;
    else 교과 += 3;
  }

  // Subject balance
  const wkCount = (a.wk || []).length;
  if (wkCount === 0) 교과 += 15;
  else if (wkCount <= 1) 교과 += 12;
  else if (wkCount <= 2) 교과 += 8;
  else 교과 += 4;

  // Improving trend
  if (trend.length >= 2) {
    const last = trend[trend.length - 1].avg;
    const first = trend[0].avg;
    if (last < first - 0.5) 교과 += 10;
    else if (last < first - 0.2) 교과 += 7;
    else if (last > first + 0.5) 교과 -= 5;
  }

  // 2. 종합전형 적합도 — record quality, narrative, activities (scaled tighter to differentiate)
  let 종합 = 0;

  // Record richness — compare against class median (~4000 chars), not absolute
  const totalChars = records.reduce((sum, r) => sum + (r.b || '').length, 0);
  if (totalChars > 6000) 종합 += 15;
  else if (totalChars > 5000) 종합 += 12;
  else if (totalChars > 4000) 종합 += 9;
  else if (totalChars > 3000) 종합 += 6;
  else 종합 += 3;

  // Academic keyword density — higher threshold for meaningful differentiation
  const allText = records.map(r => r.b || '').join(' ') + ' ' + opinions.map(o => o.b || '').join(' ');
  const keywords = ['탐구', '연구', '실험', '논문', '발표', '토론', '봉사', '리더', '프로젝트', '분석', '자기주도', '심화', '멘토', '협력', '주도'];
  let keywordCount = 0;
  keywords.forEach(k => { keywordCount += (allText.match(new RegExp(k, 'g')) || []).length; });
  if (keywordCount >= 20) 종합 += 15;
  else if (keywordCount >= 14) 종합 += 12;
  else if (keywordCount >= 9) 종합 += 9;
  else if (keywordCount >= 5) 종합 += 6;
  else 종합 += 2;

  // Career narrative consistency — strong differentiator
  const flow = a.career_flow || [];
  let careerConsistent = false;
  if (flow.length >= 2) {
    const careers = flow.map(f => f[1]);
    careerConsistent = careers.every(c => {
      const base = careers[0];
      return c === base || c.includes(base.substring(0, 2)) || base.includes(c.substring(0, 2));
    });
    if (careerConsistent) 종합 += 12;
    else 종합 += 5;
  }

  // Opinion quality
  const opinionChars = opinions.reduce((sum, o) => sum + (o.b || '').length, 0);
  if (opinionChars > 1200) 종합 += 7;
  else if (opinionChars > 800) 종합 += 5;
  else 종합 += 2;

  // Record growth across years
  const yearChars = {};
  records.forEach(r => { const y = r.y || 0; yearChars[y] = (yearChars[y] || 0) + (r.b || '').length; });
  if (yearChars[2] > yearChars[1] * 1.1) 종합 += 8;
  else if (yearChars[2] > yearChars[1]) 종합 += 5;
  else 종합 += 2;

  // Fit score
  const concept = analyzeRecord(student, a).concept;
  const fitData = calcFitScore(student, a, concept);
  if (fitData.score >= 70) 종합 += 12;
  else if (fitData.score >= 50) 종합 += 8;
  else if (fitData.score >= 30) 종합 += 4;
  else 종합 += 1;

  // 종합 advantage when grades are weak but records are strong
  if (avg > 5.0 && totalChars > 4000 && keywordCount >= 8) 종합 += 10;
  else if (avg > 5.0 && (a.str || []).length >= 1) 종합 += 5;

  // Grade baseline for 종합 (still matters, just less)
  if (avg <= 3.0) 종합 += 12;
  else if (avg <= 4.0) 종합 += 10;
  else if (avg <= 5.0) 종합 += 7;
  else if (avg <= 6.0) 종합 += 4;
  else 종합 += 2;

  // Alerts as negative signal for 종합 (진로-교과 mismatch)
  const alerts = a.alerts || [];
  if (alerts.length >= 2) 종합 -= 5;

  // 3. 논술전형 적합도
  let 논술 = 0;
  const subjAvgs = a.subj_avgs || {};
  const parsed = typeof subjAvgs === 'string' ? JSON.parse(subjAvgs) : subjAvgs;

  const mathAvg = parsed['수학'] || avg;
  const sciAvg = parsed['과학'] || avg;
  const korAvg = parsed['국어'] || avg;
  const engAvg = parsed['영어'] || avg;

  // Math strength (most critical for 논술)
  if (mathAvg <= 2.5) 논술 += 30;
  else if (mathAvg <= 3.5) 논술 += 24;
  else if (mathAvg <= 4.5) 논술 += 17;
  else if (mathAvg <= 5.5) 논술 += 11;
  else if (mathAvg <= 6.5) 논술 += 6;
  else 논술 += 3;

  // Best academic subject
  const bestAcademic = Math.min(mathAvg, sciAvg, korAvg, engAvg);
  if (bestAcademic <= 2.5) 논술 += 20;
  else if (bestAcademic <= 3.5) 논술 += 16;
  else if (bestAcademic <= 4.5) 논술 += 11;
  else if (bestAcademic <= 5.5) 논술 += 7;
  else 논술 += 3;

  // Subject gap — 논술 benefits from peak ability even with poor avg
  const gapToAvg = avg - bestAcademic;
  if (gapToAvg >= 2.0) 논술 += 12;
  else if (gapToAvg >= 1.0) 논술 += 8;
  else if (gapToAvg >= 0.5) 논술 += 4;

  // Base grade
  if (avg <= 4.0) 논술 += 15;
  else if (avg <= 5.0) 논술 += 12;
  else if (avg <= 6.0) 논술 += 9;
  else if (avg <= 7.0) 논술 += 6;
  else 논술 += 3;

  // Trend
  if (trend.length >= 2) {
    const last = trend[trend.length - 1].avg;
    const first = trend[0].avg;
    if (last < first - 0.3) 논술 += 8;
    else 논술 += 3;
  }

  // Keyword frequency analysis for display
  const foundKeywords = [];
  keywords.forEach(k => {
    const cnt = (allText.match(new RegExp(k, 'g')) || []).length;
    if (cnt >= 2) foundKeywords.push(k + '(' + cnt + ')');
  });

  // Determine recommendation with nuanced logic
  const scores = { 교과: Math.min(100, Math.max(0, 교과)), 종합: Math.min(100, Math.max(0, 종합)), 논술: Math.min(100, Math.max(0, 논술)) };
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const best = sorted[0][0];
  const bestScore = sorted[0][1];
  const gap12 = sorted[0][1] - sorted[1][1];

  let strategy = '';
  let detail = '';

  if (gap12 <= 8) {
    // Top two are close — recommend hybrid
    const t1 = sorted[0][0], t2 = sorted[1][0];
    strategy = `${t1}+${t2} 병행`;
    detail = `${t1}전형과 ${t2}전형 적합도가 비슷합니다. 대학별로 유리한 전형을 선택적으로 지원하는 것이 최적입니다.`;
  } else if (best === '교과') {
    strategy = '교과전형 중심';
    detail = '내신 성적이 안정적이고 교과 간 편차가 작아 교과전형에서 유리합니다. 안정/적정 지원에서 교과전형을 중심으로 배치하세요.';
  } else if (best === '종합') {
    strategy = '종합전형 중심';
    if (avg > 5.0) {
      detail = '내신 대비 생기부 활동이 풍부하여 종합전형에서 역전 가능성이 높습니다. 면접 준비를 통해 추가 경쟁력을 확보하세요.';
    } else {
      detail = '생기부 활동이 풍부하고 진로 일관성이 있어 종합전형에서 유리합니다. 서류와 면접 준비에 집중하세요.';
    }
  } else {
    strategy = '논술전형 병행';
    detail = '수학/과학 교과 역량이 강해 논술전형에서 좋은 결과를 기대할 수 있습니다. 교과 또는 종합전형과 병행하세요.';
  }

  // Contextual advice
  if (avg > 5.5 && scores.종합 > scores.교과) {
    detail += ' 내신 대비 생기부가 강점이므로 종합전형에서 내신 불리를 생기부로 보완하는 전략이 효과적입니다.';
  }
  if (trend.length >= 3 && trend[trend.length - 1].avg < trend[0].avg - 0.5) {
    detail += ' 성적 상승세가 뚜렷하여 종합전형 면접에서 성장 스토리로 활용 가능합니다.';
  }
  if (gapToAvg >= 1.5 && best !== '논술') {
    detail += ` ${bestAcademic === mathAvg ? '수학' : bestAcademic === sciAvg ? '과학' : bestAcademic === korAvg ? '국어' : '영어'} 교과가 평균 대비 우수하여 논술전형 1~2교 병행도 고려하세요.`;
  }

  return {
    scores,
    sorted,
    strategy,
    detail,
    keywordCount,
    foundKeywords: foundKeywords.slice(0, 6),
    recordChars: totalChars,
    fitScore: fitData.score
  };
}

function inferComboFromRule(univName) {
  const rule = NAESIN_RULES[univName];
  if (!rule || !rule.규칙) return null;
  const arr = Array.isArray(rule.규칙) ? rule.규칙 : [rule.규칙];
  const allGroups = new Set();
  arr.forEach(r => {
    if (!r) return;
    if (Array.isArray(r.규칙)) { r.규칙.forEach(sr => arr.push(sr)); return; }
    let g = Array.isArray(r.교과군) ? r.교과군 : (r.교과군 ? [r.교과군] : []);
    g = g.flatMap(x => typeof x === 'object' && x !== null ? Object.keys(x) : [x]);
    g.forEach(s => {
      if (typeof s !== 'string') return;
      const norm = s.replace(/\s/g, '').toLowerCase();
      if (norm.includes('국어')) allGroups.add('국어');
      if (norm.includes('수학')) allGroups.add('수학');
      if (norm.includes('영어')) allGroups.add('영어');
      if (norm.includes('사회') || norm.includes('한국사')) allGroups.add('사회');
      if (norm.includes('과학')) allGroups.add('과학');
    });
  });
  if (allGroups.size === 0) return '전교과';
  const has = s => allGroups.has(s);
  if (has('국어') && has('수학') && has('영어') && has('사회') && has('과학')) return '국수영사과';
  if (has('국어') && has('수학') && has('영어') && has('사회')) return '국수영사';
  if (has('국어') && has('수학') && has('영어') && has('과학')) return '국수영과';
  if (has('국어') && has('수학') && has('영어')) return '국수영';
  if (has('국어') && has('영어') && has('사회')) return '국영사';
  if (has('수학') && has('영어') && has('과학')) return '수영과';
  if (has('수학') && has('과학')) return '수과';
  return '전교과';
}

function detectJeonTypeFromCutline(cutlineType) {
  if (!cutlineType) return null;
  const t = cutlineType.toLowerCase();
  if (t.includes('논술')) return '논술';
  const 종합KW = ['종합','자기추천','미래인재','ace','바람개비','서류','네오르네상스',
    'do dream','활동우수','학교장추천','잠재능력','프론티어','다빈치','탐구형',
    '크로스오버','소프트웨어','글로벌','sw','면접'];
  if (종합KW.some(k => t.includes(k))) return '종합';
  return null;
}

function calcGradeConsistency(student) {
  const ck = 'gc_' + student.seat;
  if (_cache.trend[ck]) return _cache.trend[ck];
  const grades = student.subjects
    .filter(s => s.g != null && s.g >= 1 && s.g <= 9)
    .map(s => s.g);
  if (grades.length < 5) return (_cache.trend[ck] = { stdDev: 0, level: 'unknown', count: grades.length });
  const avg = grades.reduce((s,v) => s+v, 0) / grades.length;
  const variance = grades.reduce((s,v) => s + (v - avg) ** 2, 0) / grades.length;
  const stdDev = Math.sqrt(variance);
  let level;
  if (stdDev <= 0.8) level = 'high';
  else if (stdDev <= 1.3) level = 'medium';
  else if (stdDev <= 1.9) level = 'low';
  else level = 'very_low';
  return (_cache.trend[ck] = { stdDev: Math.round(stdDev * 100) / 100, level, count: grades.length });
}

function ensureClassScores() {
  if (_cache.classScores) return;
  _cache.classScores = {};
  STUDENTS.forEach(s => {
    const eng = toEngineFormat(s);
    for (const [uName, rule] of Object.entries(NAESIN_RULES)) {
      try {
        const r = computeScore(eng, rule, {A:1, B:3, C:5});
        if (r && r.환산등급 != null) {
          if (!_cache.classScores[uName]) _cache.classScores[uName] = [];
          _cache.classScores[uName].push(r.환산등급);
        }
      } catch(e) {}
    }
  });
  for (const arr of Object.values(_cache.classScores)) arr.sort((a,b) => a - b);
}

function getClassPercentile(score, univName) {
  ensureClassScores();
  const scores = _cache.classScores[univName];
  if (!scores || scores.length < 10) return null;
  let rank = 0;
  for (let i = 0; i < scores.length; i++) { if (scores[i] < score) rank++; else break; }
  return Math.round(rank / scores.length * 100);
}

function getCounselingRecommendation(comp, univResult) {
  const p = comp.probability;
  let category, categoryColor, emoji;
  if (p >= 65) { category = '안정 지원'; categoryColor = 'var(--green)'; emoji = '안정'; }
  else if (p >= 45) { category = '적정 지원'; categoryColor = 'var(--blue)'; emoji = '적정'; }
  else if (p >= 30) { category = '소신 지원'; categoryColor = 'var(--orange)'; emoji = '소신'; }
  else if (p >= 15) { category = '상향 지원'; categoryColor = '#c0392b'; emoji = '상향'; }
  else { category = '도전 지원'; categoryColor = 'var(--red)'; emoji = '도전'; }

  const adjs = [
    { key: 'trendBonus', val: comp.trendBonus, posNote: '성적 상승세', negNote: '성적 하락세' },
    { key: 'fitBonus', val: comp.fitBonus, posNote: '전공적합성', negNote: '' },
    { key: 'comboBonus', val: comp.comboBonus, posNote: '반영교과 유리', negNote: '반영교과 불리' },
    { key: 'minAdj', val: comp.minAdj, posNote: '', negNote: '수능최저 미충족 위험' },
    { key: 'classAdj', val: comp.classAdj, posNote: '학급 상위 환산', negNote: '학급 하위 환산' },
    { key: 'consistencyAdj', val: comp.consistencyAdj, posNote: '성적 안정성', negNote: '성적 변동' },
    { key: 'interviewAdj', val: comp.interviewAdj, posNote: '면접 대비 양호', negNote: '면접 대비 보완' },
    { key: 'ratioAdj', val: comp.ratioAdj, posNote: '낮은 경쟁률', negNote: '높은 경쟁률' },
  ];

  const strengths = adjs.filter(a => a.val > 0 && a.posNote).map(a => a.posNote);
  const weaknesses = adjs.filter(a => a.val < 0 && a.negNote).map(a => a.negNote);
  const topStrength = strengths[0] || (p >= 45 ? '내신 환산 유리' : '');
  const topWeakness = weaknesses[0] || '';

  const hasCutline = !!univResult.cutline;
  const ciWidth = comp.probHigh - comp.probLow;
  const isWideCI = ciWidth >= 25;

  let advice = '';
  if (p >= 65) {
    advice = '합격 가능성이 높습니다.';
    if (strengths.length > 1) advice += ' ' + strengths.slice(0, 2).join(' · ') + ' 등이 유리합니다.';
    else if (topStrength) advice += ' ' + topStrength + '이(가) 유리합니다.';
    if (isWideCI && !hasCutline) advice += ' (컷라인 자료 부족으로 신뢰구간 넓음)';
  } else if (p >= 45) {
    advice = '적정 범위입니다.';
    if (topStrength && topWeakness) advice += ' ' + topStrength + '이(가) 강점이지만 ' + topWeakness + '에 유의하세요.';
    else if (topStrength) advice += ' ' + topStrength + '이(가) 강점입니다.';
    if (comp.is종합 && comp.fitBonus >= 8) advice += ' 서류평가에서 유리할 수 있습니다.';
  } else if (p >= 30) {
    advice = '소신 지원 범위입니다.';
    if (topWeakness) advice += ' ' + topWeakness + '이(가) 주된 감점 요인입니다.';
    if (comp.trendBonus >= 6) advice += ' 상승세가 긍정적입니다.';
    else if (comp.trendBonus <= -5) advice += ' 최근 성적 하락에 유의하세요.';
  } else if (p >= 15) {
    advice = '상향 지원입니다.';
    if (weaknesses.length >= 2) advice += ' ' + weaknesses.slice(0, 2).join(' · ') + ' 등이 약점입니다.';
    else if (topWeakness) advice += ' ' + topWeakness + '이(가) 주요 약점입니다.';
    if (comp.is종합) advice += ' 서류·면접에서 역전 가능성이 있습니다.';
  } else {
    advice = '도전 지원입니다.';
    if (topWeakness) advice += ' ' + topWeakness + '이(가) 핵심 불리 요인입니다.';
    advice += ' 포트폴리오 내 도전 대학으로만 고려하세요.';
  }

  return { category, categoryColor, emoji, topStrength, topWeakness, strengths, weaknesses, advice };
}

function calcCompositeScore(univResult, student, analysis) {
  if (!univResult) return null;
  const reflectStr = univResult.cutline?.reflect || '';
  const combo = matchReflectCombo(reflectStr) || inferComboFromRule(univResult.univ);
  const combos = calcComboScores(student);

  // Use university-converted score (computeScore result) as primary
  // Combo average is secondary reference only — cutlines are in university-converted scale
  let comboScore = univResult.score;
  let comboUsed = null;
  let comboAvgRef = null;
  if (combo && combos[combo]) {
    comboAvgRef = combos[combo].avg;
    comboUsed = combo;
  }

  const tier = getUnivTier(univResult.univ);
  const ruleJeonType = univResult.jeonType || '';
  const cutJeonType = univResult.cutline ? detectJeonTypeFromCutline(univResult.cutline.type) : null;
  const effectiveType = cutJeonType || ruleJeonType;
  const is종합 = effectiveType.includes('종합') || effectiveType.includes('서류') || effectiveType.includes('면접');
  const is논술 = effectiveType.includes('논술');

  let base = 0;
  let classAdj = 0;
  if (univResult.cutline) {
    // 컷 대비 등급차 → 확률 (전형유형별 곡선 + 백테스트 재보정 COMPOSITE_WEIGHTS 적용)
    const diff = comboScore - univResult.cutline.cut;
    base = cutCurveProb(diff, is종합, is논술);
  } else {
    // Non-cutline universities: tier-based estimation, differentiated by 전형 type
    const tierAnchors교과 = {
      1: [[1.0,52],[1.3,42],[1.5,32],[2.0,20],[2.5,13],[3.0,8],[4.0,5],[9.0,2]],
      2: [[1.0,68],[1.5,55],[2.0,45],[2.5,37],[3.0,30],[3.5,24],[4.0,20],[5.0,14],[6.0,9],[9.0,4]],
      3: [[1.0,78],[1.5,68],[2.0,58],[2.5,50],[3.0,42],[3.5,35],[4.0,29],[5.0,22],[6.0,15],[7.0,10],[9.0,4]],
      4: [[1.0,86],[1.5,76],[2.0,66],[2.5,58],[3.0,50],[3.5,43],[4.0,36],[5.0,28],[6.0,20],[7.0,14],[9.0,7]]
    };
    const tierAnchors종합 = {
      1: [[1.0,58],[1.3,48],[1.5,38],[2.0,26],[2.5,18],[3.0,13],[4.0,8],[9.0,4]],
      2: [[1.0,72],[1.5,62],[2.0,52],[2.5,44],[3.0,36],[3.5,30],[4.0,25],[5.0,18],[6.0,13],[9.0,6]],
      3: [[1.0,82],[1.5,72],[2.0,62],[2.5,54],[3.0,46],[3.5,39],[4.0,33],[5.0,26],[6.0,19],[7.0,13],[9.0,6]],
      4: [[1.0,90],[1.5,80],[2.0,70],[2.5,62],[3.0,54],[3.5,47],[4.0,40],[5.0,32],[6.0,24],[7.0,17],[9.0,9]]
    };
    const tierAnchors논술 = {
      1: [[1.0,48],[1.5,40],[2.0,34],[2.5,28],[3.0,23],[3.5,19],[4.0,16],[5.0,12],[6.0,9],[9.0,5]],
      2: [[1.0,60],[1.5,52],[2.0,44],[2.5,38],[3.0,33],[3.5,28],[4.0,24],[5.0,18],[6.0,14],[7.0,10],[9.0,6]],
      3: [[1.0,70],[1.5,62],[2.0,54],[2.5,48],[3.0,42],[3.5,37],[4.0,32],[5.0,26],[6.0,20],[7.0,15],[9.0,8]],
      4: [[1.0,80],[1.5,72],[2.0,64],[2.5,56],[3.0,50],[3.5,44],[4.0,38],[5.0,32],[6.0,25],[7.0,18],[9.0,10]]
    };
    const tierSet = is논술 ? tierAnchors논술 : is종합 ? tierAnchors종합 : tierAnchors교과;
    const diff = getUnivDifficulty(univResult.univ);
    let effectiveTier = tier;
    if (diff) {
      // High avg class score = strict formula = genuinely harder → promote to lower tier
      // Low avg class score = generous formula = easier → keep or demote tier
      if (diff.avg >= 5.5 && tier >= 3) effectiveTier = Math.max(2, tier - 1);
      else if (diff.avg <= 3.5 && tier <= 3) effectiveTier = Math.min(4, tier + 1);
    }
    const anchors = tierSet[effectiveTier] || tierSet[4];
    let base1 = interpolateAnchors(comboScore, anchors, comboScore < anchors[0][0] ? anchors[0][1] + 5 : 3);
    if (diff && effectiveTier !== tier) {
      const altAnchors = tierSet[tier] || tierSet[4];
      const base2 = interpolateAnchors(comboScore, altAnchors, comboScore < altAnchors[0][0] ? altAnchors[0][1] + 5 : 3);
      base = Math.round(base1 * 0.6 + base2 * 0.4);
    } else {
      base = base1;
    }

    // 어디가 학과별 컷 반영: 학과 키("대학명|학과명") 조회 결과가 있으면
    // 컷 기반 확률을 티어 추정치와 블렌딩 (학과 컷 55% / 티어 45%)
    // 어디가 등급50/70 컷은 등록자 학생부 전과목 평균등급(1~9) 기준 공시값이므로
    // 학생 측도 전과목 단위가중 평균등급으로 동일 스케일 비교 (상위N 환산등급 혼용 금지)
    if (univResult.deptCut && univResult.deptCut.cut != null) {
      const stAvgAll = calcWeightedAvg(student);
      const dBase = cutCurveProb(stAvgAll - univResult.deptCut.cut, is종합, is논술);
      base = Math.round(dBase * 0.55 + base * 0.45);
    }

    const classPctl = getClassPercentile(comboScore, univResult.univ);
    if (classPctl != null) {
      const tierScale = effectiveTier >= 4 ? 1.8 : effectiveTier >= 3 ? 1.4 : effectiveTier >= 2 ? 1.0 : 0.7;
      if (classPctl <= 5) classAdj = Math.round(8 * tierScale);
      else if (classPctl <= 10) classAdj = Math.round(6 * tierScale);
      else if (classPctl <= 20) classAdj = Math.round(4 * tierScale);
      else if (classPctl <= 35) classAdj = Math.round(2 * tierScale);
      else if (classPctl <= 45) classAdj = Math.round(1 * tierScale);
      else if (classPctl >= 95) classAdj = -Math.round(7 * tierScale);
      else if (classPctl >= 85) classAdj = -Math.round(5 * tierScale);
      else if (classPctl >= 75) classAdj = -Math.round(3 * tierScale);
      else if (classPctl >= 60) classAdj = -Math.round(1 * tierScale);
      else if (classPctl >= 55) classAdj = -1;

      // Percentile-based probability correction for score-scale mismatches
      const pctlProbTable = [
        [2, 85], [5, 75], [10, 63], [15, 55], [20, 48],
        [30, 38], [40, 28], [50, 22], [60, 16], [70, 11],
        [80, 7], [90, 4], [95, 2]
      ];
      let pctlBase = interpolateAnchors(classPctl, pctlProbTable, 90);
      pctlBase = Math.round(pctlBase * (effectiveTier >= 4 ? 0.7 : effectiveTier >= 3 ? 0.8 : effectiveTier >= 2 ? 0.9 : 1.0));
      const corrGap = pctlBase - (base + classAdj);
      const absGap = Math.abs(corrGap);
      if (absGap > 10) {
        const excess = absGap - 10;
        const corr = Math.sign(corrGap) * Math.round(excess * 0.15);
        classAdj += Math.max(-6, Math.min(6, corr));
      }
    }
  }

  // Trend analysis: use combo-specific trend when available, global otherwise
  const comboTrend = comboUsed ? calcComboTrend(student, comboUsed) : null;
  const globalTrend = calcYearlyTrend(student);
  const trend = (comboTrend && comboTrend.length >= 2) ? comboTrend : globalTrend;
  const trendIsCombo = (comboTrend && comboTrend.length >= 2);
  let trendBonus = 0;
  if (trend.length >= 3) {
    const first = trend[0].avg, last = trend[trend.length-1].avg;
    const overallDiff = last - first;
    const recent = trend.slice(-2);
    const recentDiff = recent.length === 2 ? recent[1].avg - recent[0].avg : 0;
    const recentWeight = is종합 ? 0.7 : 0.6;
    const overallWeight = 1 - recentWeight;
    const combinedDiff = recentDiff * recentWeight + overallDiff * overallWeight;
    const trendMult = is종합 ? 1.3 : is논술 ? 0.5 : 0.45;
    const comboBoost = trendIsCombo ? 1.15 : 1.0;
    if (combinedDiff < -0.6) trendBonus = Math.round(9 * trendMult * comboBoost);
    else if (combinedDiff < -0.3) trendBonus = Math.round(6 * trendMult * comboBoost);
    else if (combinedDiff < -0.1) trendBonus = Math.round(3 * trendMult * comboBoost);
    else if (combinedDiff > 0.6) trendBonus = Math.round(-7 * trendMult * comboBoost);
    else if (combinedDiff > 0.3) trendBonus = Math.round(-4 * trendMult * comboBoost);
    else if (combinedDiff > 0.1) trendBonus = Math.round(-2 * trendMult * comboBoost);
  } else if (trend.length === 2) {
    const trendMult2 = is종합 ? 1.3 : is논술 ? 0.5 : 0.45;
    const diff = trend[1].avg - trend[0].avg;
    if (diff < -0.5) trendBonus = Math.round(6 * trendMult2);
    else if (diff < -0.2) trendBonus = Math.round(3 * trendMult2);
    else if (diff > 0.5) trendBonus = Math.round(-5 * trendMult2);
    else if (diff > 0.2) trendBonus = Math.round(-2 * trendMult2);
  }
  if (trendBonus > 0) trendBonus = Math.round(trendBonus * Math.min(1, base / 35));
  else if (trendBonus < 0) trendBonus = Math.round(trendBonus * Math.min(1, (100 - base) / 35));

  // Competition ratio: more granular
  let ratioAdj = 0;
  if (univResult.cutline && univResult.cutline.ratio) {
    const r = parseFloat(univResult.cutline.ratio);
    if (!isNaN(r)) {
      if (r > 20) ratioAdj = -6;
      else if (r > 15) ratioAdj = -4;
      else if (r > 10) ratioAdj = -3;
      else if (r > 7) ratioAdj = -1;
      else if (r < 2.5) ratioAdj = 4;
      else if (r < 4) ratioAdj = 2;
      else if (r < 5.5) ratioAdj = 1;
    }
  }

  // 수능최저: parse actual requirements
  const studentAvg = calcWeightedAvg(student);
  const minReq = parseMinRequirement(univResult.cutline?.min, studentAvg, student);
  const minAdj = minReq.penalty;

  // Reliability discount
  let reliabilityAdj = 0;
  if (univResult.reliability === 'none') reliabilityAdj = -3;
  else if (univResult.reliability === 'low') reliabilityAdj = -2;

  // Subject count
  let countAdj = 0;
  if (univResult.count && univResult.count < 10) countAdj = -2;

  // Fit score — 종합전형에서 전공적합성이 합격에 미치는 영향 크게 강화
  const concept = analyzeRecord(student, analysis || {}).concept;
  const fitData = calcFitScore(student, analysis || {}, concept);
  let fitBonus;
  if (is종합) {
    const jt = effectiveType.toLowerCase();
    const has면접 = jt.includes('면접') || univResult.hasInterviews;
    const fitCoeff = tier <= 2
      ? (has면접 ? 0.18 : 0.14)
      : (has면접 ? 0.15 : 0.12);
    fitBonus = Math.round(fitData.score * fitCoeff);
  } else if (is논술) {
    fitBonus = Math.round(fitData.score * 0.02);
  } else {
    fitBonus = Math.round(fitData.score * 0.01);
  }

  let comboBonus = 0;
  if (comboAvgRef != null) {
    const overallAvg = calcWeightedAvg(student);
    const comboDiff = overallAvg - comboAvgRef;
    const mult = is논술 ? 1.5 : is종합 ? 2.0 : 3.0;
    if (comboDiff > 0.2) {
      comboBonus = Math.round(comboDiff * mult);
      comboBonus = Math.min(comboBonus, is논술 ? 3 : 5);
    } else if (comboDiff < -0.2) {
      comboBonus = Math.round(comboDiff * mult);
      comboBonus = Math.max(comboBonus, is논술 ? -3 : -5);
    }
  }

  // Grade consistency: uniform grades across subjects → more predictable outcome
  const gc = calcGradeConsistency(student);
  let consistencyAdj = 0;
  if (!is논술) {
    if (gc.level === 'high') consistencyAdj = is종합 ? 1 : 2;
    else if (gc.level === 'low') consistencyAdj = is종합 ? 0 : -1;
    else if (gc.level === 'very_low') consistencyAdj = is종합 ? -1 : -2;
  }

  // Interview readiness: for 종합전형 with interviews, assess profile-interview alignment
  const irData = (is종합 && univResult.hasInterviews) ? calcInterviewReadiness(student, analysis || {}, univResult.univ) : null;
  let interviewAdj = 0;
  if (irData) {
    interviewAdj = Math.round((irData.score - 50) * 0.08);
    interviewAdj = Math.max(-4, Math.min(4, interviewAdj));
  }

  let raw = base + trendBonus + ratioAdj + minAdj + reliabilityAdj + countAdj + fitBonus + comboBonus + consistencyAdj + classAdj + interviewAdj;
  if (raw > 90) raw = 90 + (raw - 90) * 0.3;
  else if (raw < 10) raw = 10 - (10 - raw) * 0.3;
  raw = Math.max(3, Math.min(97, Math.round(raw)));

  // 요인별 기여도 breakdown (절대 기여량 기준, 합 100%) — 현재 존재하는 요인들
  const factorBreakdown = buildFactorBreakdown({
    내신: base,
    생기부매칭: fitBonus,
    성적추세: trendBonus,
    경쟁률: ratioAdj,
    수능최저: minAdj,
    학급위치: classAdj,
    반영교과: comboBonus,
    성적일관성: consistencyAdj,
    면접: interviewAdj,
    신뢰도보정: (reliabilityAdj || 0) + (countAdj || 0)
  });

  // Confidence interval: width depends on data quality and admission type
  let ciHalf = 8;
  if (is종합) ciHalf = 12;
  else if (is논술) ciHalf = 14;
  if (!univResult.cutline && classAdj === 0) ciHalf += 3;
  else if (!univResult.cutline && Math.abs(classAdj) >= 6) ciHalf -= 1;
  else if (!univResult.cutline && Math.abs(classAdj) <= 1) ciHalf += 2;
  else if (!univResult.cutline) ciHalf += 1;
  // 학과별 실제 컷이 있으면 불확실성 축소
  if (!univResult.cutline && univResult.deptCut && univResult.deptCut.cut != null) {
    ciHalf = Math.max(5, ciHalf - (univResult.deptCut.matched ? 3 : 2));
  }
  if (univResult.reliability === 'none') ciHalf += 4;
  else if (univResult.reliability === 'low') ciHalf += 2;
  else if (univResult.reliability === 'medium') ciHalf += 1;
  if (univResult.count && univResult.count < 10) ciHalf += 2;
  if (gc.level === 'very_low') ciHalf += 3;
  else if (gc.level === 'low') ciHalf += 1;
  else if (gc.level === 'high') ciHalf = Math.max(4, ciHalf - 2);
  if (irData) ciHalf = Math.max(4, ciHalf - 1);
  const probLow = Math.max(1, raw - ciHalf);
  const probHigh = Math.min(99, raw + ciHalf);

  // ── 최종 출력: 4구간 분류 (안정/적정/소신/상향) ──
  // 연속 확률값 대신 어디가 등급50/70과 학생 전과목 평균등급(동일 스케일) 비교로 판정.
  // 경계 정의·근거는 classifyBand() 주석 참조. 컷 결측이면 band=null(판정 강제 안 함).
  let band = null, bandNoCutLabel = null, bandBase = null, bandAdjusted = false, cwMultiple = null;
  let bandReason = null;        // 상담사용 판정 근거 문자열
  let judgeReliability = null;  // 학과별 판정 신뢰도 (빌드 단계 산출: 높음/보통/낮음)
  {
    const dcB = univResult.deptCut;
    if (dcB && (dcB.g50 != null || dcB.g70 != null)) {
      const sAvg = calcWeightedAvg(student);
      cwMultiple = dcB.cw != null ? dcB.cw : null;
      bandBase = classifyBand(sAvg, dcB.g50, dcB.g70);            // 보정 전
      band = classifyBand(sAvg, dcB.g50, dcB.g70, cwMultiple);    // 충원배수 보정 후 (기준: classifyBand 주석)
      bandAdjusted = band !== bandBase;
      judgeReliability = dcB.rel || '보통';
      // 판정 근거: 컷 비교 → 기본 구간 → 충원 보정 → 생기부 매칭 순으로 읽히게 구성
      const cutsTxt = [dcB.g50 != null ? `50컷 ${dcB.g50}` : null, dcB.g70 != null ? `70컷 ${dcB.g70}` : null]
        .filter(Boolean).join('·');
      const parts = [`평균등급 ${sAvg.toFixed(2)} vs ${cutsTxt} → ${bandBase}`];
      if (bandAdjusted) parts.push(`충원 ${cwMultiple.toFixed(1)}배수 감안 시 ${band}`);
      else if (cwMultiple != null) parts.push(cwMultiple >= 1.0
        ? `충원 ${cwMultiple.toFixed(1)}배수(${bandBase} 구간은 보정 대상 아님)`
        : `충원 ${cwMultiple.toFixed(1)}배수(보정 기준 1.0 미만)`);
      if (fitBonus) parts.push(`생기부 매칭 ${fitBonus > 0 ? '+' : ''}${fitBonus}점`);
      bandReason = parts.join(', ');
    } else if (dcB && dcB.noCut) {
      bandNoCutLabel = dcB.label || '컷 정보 없음';
      judgeReliability = '낮음';  // 등급50·70 모두 결측
      bandReason = bandNoCutLabel;
    } else if (univResult.cutline && univResult.cutline.cut != null) {
      // 어디가 학과컷은 없지만 레거시 컷라인(반영교과 환산 기준)이 있는 대학:
      // 같은 4구간 사다리를 환산등급 vs 컷에 적용 (등급50/70 구분 없음 → 단일 컷 기준,
      // 충원배수 자료 없음 → 보정 미적용)
      band = bandBase = classifyBand(univResult.score, univResult.cutline.cut, univResult.cutline.cut);
      judgeReliability = '보통';  // 컷 정보는 있으나 등급50/70·충원 자료 없음
      bandReason = `환산내신 ${univResult.score.toFixed(2)} vs 컷 ${univResult.cutline.cut} → ${band}`
        + (fitBonus ? `, 생기부 매칭 ${fitBonus > 0 ? '+' : ''}${fitBonus}점` : '');
    } else {
      bandNoCutLabel = '컷 정보 없음';
      judgeReliability = null;
      bandReason = null;
    }
  }
  // 텍스트 표시용 라벨 — 보정 적용 시 사실을 드러낸다
  const bandLabel = band ? (bandAdjusted ? `충원 감안 시 ${band}` : band) : null;

  return {
    band, bandBase, bandAdjusted, bandLabel, cwMultiple, bandNoCutLabel,
    bandReason, judgeReliability,
    // probability 이하 수치는 내부 계산용(정렬·포트폴리오 통계·신뢰구간)으로만 사용하며
    // 추천 화면에는 표시하지 않는다 (구간 배지로 대체)
    probability: raw, probLow, probHigh,
    comboScore, comboUsed, comboAvgRef,
    trendBonus, trendIsCombo, ratioAdj, minAdj, fitBonus, comboBonus,
    consistencyAdj, gradeConsistency: gc,
    classAdj, interviewAdj, interviewData: irData,
    reliabilityAdj, countAdj,
    fitData, minReq,
    deptCut: univResult.deptCut || null,
    factorBreakdown,
    is종합, is논술, tier
  };
}

// 요인별 기여도 breakdown: {요인:기여값} → [{key,pct}] (절대값 비율, 합 정확히 100)
function buildFactorBreakdown(factors) {
  const entries = Object.entries(factors).map(([key, val]) => ({ key, val: Number(val) || 0, abs: Math.abs(Number(val) || 0) }));
  const totalAbs = entries.reduce((s, e) => s + e.abs, 0);
  if (totalAbs <= 0) {
    // 모든 요인이 0 → 내신 100%로 처리
    return entries.map(e => ({ key: e.key, val: e.val, pct: e.key === '내신' ? 100 : 0 }));
  }
  // 초기 반올림
  let out = entries.map(e => ({ key: e.key, val: e.val, pct: Math.round(e.abs / totalAbs * 100) }));
  // 반올림 오차를 최대 기여 요인에 흡수 → 합 정확히 100
  const diff = 100 - out.reduce((s, e) => s + e.pct, 0);
  if (diff !== 0) {
    let maxIdx = 0;
    for (let i = 1; i < out.length; i++) if (out[i].pct > out[maxIdx].pct) maxIdx = i;
    out[maxIdx].pct += diff;
  }
  return out;
}

function renderRoster() {

      <div class="student-meta">
        <div class="name">${esc(s.name)}</div>
        <div class="grade-chip" style="color:${gradeColor(avg)}">${avg.toFixed(2)}등급</div>
      </div>
    </button>`;
  });
  roster.innerHTML = html;
}

function filterRoster(query) {
  const q = query.toLowerCase();
  document.querySelectorAll('.student-btn').forEach(btn => {
    const name = btn.querySelector('.name').textContent.toLowerCase();
    const seat = btn.querySelector('.student-avatar').textContent;
    btn.style.display = (name.includes(q) || seat.includes(q) || !q) ? '' : 'none';
  });
  const visible = document.querySelectorAll('.student-btn:not([style*="display: none"])').length;
  document.getElementById('rosterCount').textContent = visible;
}

  html += '<h3 style="margin-top:20px">전공적합성 분포</h3>';

  });
  html += '</div>';

  html += '<h3 style="margin-top:20px">학급 전체 대학 지원 현황</h3>';

  if (!_cache.heatmap) {

        else if (comp.probability >= 15) univStudentMap[r.univ].reach++;

      });

      .map(([univ, d]) => ({ univ, ...d, weighted: d.safe * 3 + d.fit * 2 + d.reach }))
      .sort((a, b) => b.weighted - a.weighted)

        <td><span style="display:inline-block;width:${Math.max(4, u.reach/34*60)}px;height:14px;background:var(--orange);border-radius:3px;vertical-align:middle;opacity:0.7"></span> ${u.reach}</td>
        <td style="font-weight:600">${u.total}</td>
      </tr>`;
    });

  }

  // Class-wide admission potential summary (cached)
  if (!_cache.classPortfolio) {
    const stats = { atLeastOneSum: 0, expectedSum: 0, count: 0 };

    STUDENTS.forEach(s => {
      const a = ANALYSIS[s.seat] || {};
      const results = runAllUniversities(s);
      const allC = results.map(r => {
        const comp = calcCompositeScore(r, s, a);
        return { ...r, prob: comp.probability, comp };
      }).sort((a, b) => b.prob - a.prob);
      if (allC.length >= 6) {
        const port = calcOptimalPortfolio(allC, 6);
        stats.atLeastOneSum += port.atLeastOne;
        stats.expectedSum += port.expectedCount;
        stats.count++;
        if (port.atLeastOne >= 95) bands.high++;
        else if (port.atLeastOne >= 80) bands.mid++;
        else if (port.atLeastOne >= 60) bands.low++;
        else bands.warn++;
      }
    });
    _cache.classPortfolio = { stats, bands };
  }
  const { stats: classPortfolioStats, bands: portBands } = _cache.classPortfolio;

  html += '<h3 style="margin-top:20px">학급 합격 예측 요약</h3>';
  html += '<p style="font-size:11px;color:var(--muted);margin-bottom:10px">전체 학생의 AI 최적 포트폴리오 기반 합격 예측 통계입니다.</p>';
  if (classPortfolioStats.count > 0) {
    const avgALO = Math.round(classPortfolioStats.atLeastOneSum / classPortfolioStats.count);
    const avgExp = (classPortfolioStats.expectedSum / classPortfolioStats.count).toFixed(1);
    html += '<div class="stat-grid" style="margin-bottom:12px">';
    html += `<div class="stat-box"><div class="num" style="color:var(--green)">${avgALO}%</div><div class="label">평균 합격 확률 (최소 1교)</div></div>`;
    html += `<div class="stat-box"><div class="num" style="color:var(--blue)">${avgExp}교</div><div class="label">평균 기대 합격 수</div></div>`;
    html += `<div class="stat-box"><div class="num">${portBands.high}</div><div class="label">안정 (95%+)</div></div>`;
    html += `<div class="stat-box"><div class="num" style="color:var(--orange)">${portBands.warn}</div><div class="label">주의 (<60%)</div></div>`;
    html += '</div>';
  }

  // Counseling priority students
  html += '<h3 style="margin-top:20px">상담 우선 학생</h3>';
  html += '<p style="font-size:11px;color:var(--muted);margin-bottom:10px">성적 변화, 진로 적합도, 또는 특이사항으로 우선 상담이 필요한 학생입니다.</p>';
  const priorityStudents = [];
  STUDENTS.forEach((s, i) => {
    const avg = calcWeightedAvg(s);
    const a = ANALYSIS[s.seat] || {};
    const ra = analyzeRecord(s, a);
    const fit = calcFitScore(s, a, ra.concept);
    const trend = calcYearlyTrend(s);
    const reasons = [];
    if (trend.length >= 2) {
      const diff = trend[trend.length-1].avg - trend[0].avg;
      if (diff > 1.0) reasons.push({text:'성적 급락 (' + Math.abs(diff).toFixed(1) + '등급↓)', severity:3});
      else if (diff < -1.0) reasons.push({text:'성적 급상승 (' + Math.abs(diff).toFixed(1) + '등급↑)', severity:1});
    }
    if (fit.score < 30) reasons.push({text:'전공적합성 낮음 (' + fit.score + '점)', severity:2});
    if (!ra.concept) reasons.push({text:'진로 방향 미설정', severity:2});
    if (ra.storyArc.length >= 2) {
      const first = ra.storyArc[0], last = ra.storyArc[ra.storyArc.length-1];
      if (first.career !== last.career) reasons.push({text:'진로 변경 (' + first.career + '→' + last.career + ')', severity:1});
    }
    if (avg > 6.0) reasons.push({text:'전체 평균 ' + avg.toFixed(1) + '등급', severity:1});
    if (reasons.length > 0) {
      const maxSev = Math.max(...reasons.map(r => r.severity));
      priorityStudents.push({idx: i, name: s.name, seat: s.seat, reasons, severity: maxSev, avg});
    }
  });
  priorityStudents.sort((a, b) => b.severity - a.severity || a.avg - b.avg);
  if (priorityStudents.length > 0) {
    priorityStudents.slice(0, 12).forEach(ps => {
      const sevColor = ps.severity >= 3 ? 'var(--red)' : ps.severity >= 2 ? 'var(--orange)' : 'var(--blue)';
      html += `<div class="dash-priority" data-pidx="${ps.idx}" style="border-left:3px solid ${sevColor};padding:10px 14px;margin-bottom:6px;background:var(--card);border-radius:var(--radius-sm);cursor:pointer" onclick="selectStudent(${ps.idx})">
        <div class="ds-name">${ps.seat}번 ${esc(ps.name)}</div>
        <div style="font-size:10px;color:var(--muted)">${ps.reasons.map(r => r.text).join(' · ')}</div>
      </div>`;
    });
  } else {
    html += '<div style="font-size:12px;color:var(--muted)">특별히 우선 상담이 필요한 학생이 없습니다.</div>';
  }

  // Sortable student ranking table
  html += '<h3 style="margin-top:20px">전체 학생 순위표 <button id="compareBtn" style="float:right;font-size:11px;padding:4px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--teal)" onclick="toggleCompareMode()">비교 모드</button></h3>';
  html += '<p style="font-size:11px;color:var(--muted);margin-bottom:10px">열 제목을 클릭하면 정렬합니다. 학생 이름을 클릭하면 상세 분석 화면으로 이동합니다.</p>';
  html += '<div id="compareSel" style="display:none;margin-bottom:8px;padding:8px 12px;background:var(--blue-light);border-radius:8px;font-size:12px">학생을 2~3명 선택하세요. <button style="margin-left:8px;padding:3px 10px;border-radius:6px;border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer;font-size:11px" onclick="runCompare()">비교하기</button> <span id="compareCount">0</span>명 선택됨</div>';

  if (!_cache.studentRanking) {
    _cache.studentRanking = STUDENTS.map((s, i) => {
      const avg = calcWeightedAvg(s);
      const a = ANALYSIS[s.seat] || {};
      const ra = analyzeRecord(s, a);
      const fit = calcFitScore(s, a, ra.concept);
      const trend = calcYearlyTrend(s);
      const combos = calcComboScores(s);
      const results = runAllUniversities(s);
      const allC = results.map(r => {
        const comp = calcCompositeScore(r, s, a);
        return { univ: r.univ, prob: comp.probability };
      }).sort((a, b) => b.prob - a.prob);

      let bestCombo = '', bestComboScore = 99;
      COMBO_ORDER.forEach(c => { if (combos[c] && combos[c].avg < bestComboScore) { bestComboScore = combos[c].avg; bestCombo = c; } });

      let trendDir = 0;
      if (trend.length >= 2) trendDir = trend[trend.length-1].avg - trend[0].avg;

      const safeCount = allC.filter(r => r.prob >= 65).length;
      const topUniv = allC[0] || { univ: '-', prob: 0 };

      return {
        idx: i, name: s.name, seat: s.seat, avg, fit: fit.score,
        concept: ra.concept || '', bestCombo, bestComboScore,
        trendDir, safeCount, topUniv: topUniv.univ, topProb: topUniv.prob
      };
    });
  }
  const ranking = _cache.studentRanking;

  html += '<div class="scroll-table" style="max-height:700px"><table class="g-table" id="studentRankTable">';
  html += '<thead><tr>';
  const cols = [
    {key:'seat', label:'번호', w:'42px'},
    {key:'name', label:'이름', w:'70px'},
    {key:'avg', label:'평균', w:'55px'},
    {key:'bestComboScore', label:'최적조합', w:'90px'},
    {key:'trendDir', label:'추세', w:'55px'},
    {key:'fit', label:'적합성', w:'50px'},
    {key:'concept', label:'진로', w:'55px'},
    {key:'safeCount', label:'안정권', w:'45px'},
    {key:'topProb', label:'1순위 대학', w:'auto'}
  ];
  cols.forEach(c => {
    html += `<th style="cursor:pointer;white-space:nowrap;width:${c.w};user-select:none" onclick="sortStudentRank('${c.key}')">${c.label} <span class="rank-sort-arrow" data-col="${c.key}" style="font-size:10px;color:var(--muted)"></span></th>`;
  });
  html += '</tr></thead><tbody id="studentRankBody">';

  const sorted = [...ranking].sort((a, b) => a.avg - b.avg);
  sorted.forEach((r, rank) => {
    const tArrow = r.trendDir < -0.3 ? '↑' : r.trendDir > 0.3 ? '↓' : '→';
    const tColor = r.trendDir < -0.3 ? 'var(--green)' : r.trendDir > 0.3 ? 'var(--red)' : 'var(--muted)';
    const fitC = r.fit >= 60 ? 'var(--green)' : r.fit >= 35 ? 'var(--blue)' : 'var(--orange)';
    const pColor = r.topProb >= 65 ? 'var(--green)' : r.topProb >= 40 ? 'var(--blue)' : r.topProb >= 15 ? 'var(--orange)' : 'var(--red)';
    html += `<tr class="dash-student" data-idx="${r.idx}" style="cursor:pointer" data-seat="${r.seat}" data-avg="${r.avg}" data-bestcomboscore="${r.bestComboScore}" data-trenddir="${r.trendDir}" data-fit="${r.fit}" data-concept="${esc(r.concept)}" data-safecount="${r.safeCount}" data-topprob="${r.topProb}">
      <td style="text-align:center;font-weight:600">${r.seat}</td>
      <td style="font-weight:600;color:var(--teal)">${esc(r.name)}</td>
      <td class="mono" style="font-weight:700;color:${gradeColor(r.avg)}">${r.avg.toFixed(2)}</td>
      <td style="font-size:11px"><span class="mono" style="font-weight:600;color:${gradeColor(r.bestComboScore)}">${r.bestComboScore < 99 ? r.bestComboScore.toFixed(2) : '-'}</span> <span style="color:var(--muted);font-size:9px">${r.bestCombo ? esc(r.bestCombo.substring(0,4)) : ''}</span></td>
      <td style="text-align:center;color:${tColor};font-weight:700">${tArrow}${Math.abs(r.trendDir) >= 0.3 ? Math.abs(r.trendDir).toFixed(1) : ''}</td>
      <td style="text-align:center;font-weight:700;color:${fitC}">${r.fit}</td>
      <td style="font-size:11px;color:var(--sub)">${r.concept ? esc(r.concept) : '<span style="color:var(--muted)">-</span>'}</td>
      <td style="text-align:center;font-weight:700;color:${r.safeCount >= 3 ? 'var(--green)' : r.safeCount >= 1 ? 'var(--blue)' : 'var(--red)'}">${r.safeCount}</td>
      <td style="font-size:11px"><span style="font-weight:600">${esc(r.topUniv.length > 6 ? r.topUniv.substring(0,6) + '..' : r.topUniv)}</span> <span class="mono" style="font-weight:700;color:${pColor}">${r.topProb}%</span></td>
    </tr>`;
  });
  html += '</tbody></table></div></div>';

  el.innerHTML = html;

  // Click handlers for dashboard students
  el.querySelectorAll('.dash-student').forEach(btn => {
    btn.addEventListener('click', () => selectStudent(parseInt(btn.dataset.idx)));
  });
}

// ═══════════════════════════════════════════════
// RENDER: STUDENT PROFILE
// ═══════════════════════════════════════════════
function selectStudent(idx) {
  selectedIdx = idx;
  const student = STUDENTS[idx];
  const analysis = ANALYSIS[student.seat] || {};

  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('studentView').style.display = '';

  // Update sidebar
  document.querySelectorAll('.student-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.student-btn[data-idx="${idx}"]`);
  if (btn) btn.classList.add('active');

  // Cache university results
  univResults = runAllUniversities(student);

  renderProfileHeader(student, analysis);
  renderScoreTab(student, analysis);
  renderSusiTab(student, analysis);
  renderRecordTab(student, analysis);
  renderMemoTab(student);

  // Save last selection
  localStorage.setItem('susi27_last', idx);

  // Mobile: close sidebar
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

function renderProfileHeader(student, analysis) {
  const el = document.getElementById('profileHeader');
  const avg = calcWeightedAvg(student);
  const career = analysis.career_flow;
  const latestCareer = career && career.length > 0 ? career[career.length-1][1] : '';

  let chips = `<span class="chip chip-teal">평균 ${avg.toFixed(2)}등급</span>`;
  if (analysis.str && analysis.str.length) chips += `<span class="chip chip-green">강점: ${esc(analysis.str.join(', '))}</span>`;
  if (latestCareer) chips += `<span class="chip chip-copper">${esc(latestCareer)}</span>`;
  const fitData = calcFitScore(student, analysis, null);
  // 단일 점수(전공적합성 N점) 표시는 제거 — 판정은 4구간 + 근거 문자열로만 표시

  el.innerHTML = `<div class="profile-header">
    <div class="profile-avatar">${student.seat}</div>
    <div class="profile-info">
      <div class="pname">${esc(student.name)} <button onclick="exportReport()" style="font-size:11px;padding:2px 10px;border:1px solid var(--copper);border-radius:6px;background:none;color:var(--copper);cursor:pointer;font-family:inherit;vertical-align:middle;margin-left:6px">보고서</button></div>
      <div class="pmeta">3학년 4반 ${student.seat}번 · 병점고등학교</div>
    </div>
    <div class="profile-chips">${chips}</div>
  </div>`;
}

// ═══════════════════════════════════════════════
// TAB 1: SCORE ANALYSIS
// ═══════════════════════════════════════════════
function renderScoreTab(student, analysis) {
  const el = document.getElementById('panel-score');
  const avg = calcWeightedAvg(student);
  const subjAvgs = calcSubjectAvgs(student);
  const combos = calcComboScores(student);
  const trend = calcYearlyTrend(student);

  let html = '';

  // Summary stats
  html += '<div class="glass"><h3>성적 요약</h3><div class="stat-grid">';
  html += `<div class="stat-box"><div class="num" style="color:${gradeColor(avg)}">${avg.toFixed(2)}</div><div class="label">전체 평균등급 (가중)</div></div>`;
  if (subjAvgs.length > 0) {
    html += `<div class="stat-box"><div class="num" style="font-size:20px;color:var(--green)">${esc(subjAvgs[0].name)} ${subjAvgs[0].avg.toFixed(1)}</div><div class="label">최강 교과</div></div>`;
    const worst = subjAvgs[subjAvgs.length-1];
    html += `<div class="stat-box"><div class="num" style="font-size:20px;color:var(--red)">${esc(worst.name)} ${worst.avg.toFixed(1)}</div><div class="label">보완 교과</div></div>`;
  }
  const graded = student.subjects.filter(s => s.g != null && s.g >= 1 && s.g <= 9);
  html += `<div class="stat-box"><div class="num">${graded.length}</div><div class="label">반영 과목 수</div></div>`;
  const gc = calcGradeConsistency(student);
  if (gc.level !== 'unknown') {
    const gcColor = gc.level === 'high' ? 'var(--green)' : gc.level === 'medium' ? 'var(--blue)' : 'var(--orange)';
    const gcLabel = gc.level === 'high' ? '안정' : gc.level === 'medium' ? '보통' : gc.level === 'low' ? '변동' : '불안정';
    html += `<div class="stat-box"><div class="num" style="font-size:20px;color:${gcColor}">${gcLabel}</div><div class="label">성적 일관성 (σ${gc.stdDev})</div></div>`;
  }
  html += '</div>';

  // Class position indicator
  const allAvgs = STUDENTS.map((s, i) => ({ idx: i, name: s.name, seat: s.seat, avg: calcWeightedAvg(s) })).sort((a, b) => a.avg - b.avg);
  const rank = allAvgs.findIndex(a => a.idx === selectedIdx) + 1;
  const percentile = Math.round((1 - (rank - 1) / (STUDENTS.length - 1)) * 100);

  html += `<div style="margin-top:12px;padding:12px;background:var(--cream);border-radius:10px">`;
  html += `<div style="font-size:12px;font-weight:700;margin-bottom:8px">학급 내 위치 (${STUDENTS.length}명 중 ${rank}위 · 상위 ${percentile <= 50 ? percentile + '%' : (100 - percentile) + '% (하위)'})</div>`;
  // Distribution bar with position marker
  html += '<div style="position:relative;height:24px;background:linear-gradient(to right, var(--green), var(--blue), var(--orange), var(--red));border-radius:12px;opacity:0.3"></div>';
  const markerPos = ((rank - 1) / (STUDENTS.length - 1)) * 100;
  html += `<div style="position:relative;margin-top:-24px;height:24px">
    <div style="position:absolute;left:${markerPos}%;transform:translateX(-50%);top:-2px">
      <div style="width:4px;height:28px;background:var(--ink);border-radius:2px"></div>
    </div>
  </div>`;
  // 다른 학생의 성적은 노출하지 않음 — 위치 구간만 익명 표시
  html += `<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px">
    <span>최상위</span>
    <span>중위</span>
    <span>최하위</span>
  </div>`;
  html += '<div style="margin-top:8px;font-size:10px;color:var(--muted)">※ 개인정보 보호를 위해 다른 학생의 성적은 표시하지 않습니다.</div>';

  html += '</div></div>';

  // Subject bars
  html += '<div class="glass"><h3>교과별 평균등급</h3>';
  subjAvgs.forEach(s => {
    const pct = Math.max(5, (10 - s.avg) / 9 * 100);
    const c = gradeColor(s.avg);
    html += `<div class="subj-bar">
      <span class="lbl">${esc(s.name)}</span>
      <div class="bar-bg"><div class="bar-fg" style="width:${pct}%;background:${c}"></div></div>
      <span class="val" style="color:${c}">${s.avg.toFixed(2)}</span>
    </div>`;
  });

  // SVG Radar chart
  const radarSubjects = subjAvgs.filter(s => !['한국사','기가/제2외','예술','체육'].includes(s.name)).slice(0, 6);
  if (radarSubjects.length >= 3) {
    const n = radarSubjects.length;
    const cx = 120, cy = 120, r = 90;
    let svg = `<div style="text-align:center;margin-top:16px"><svg viewBox="0 0 240 240" style="max-width:260px;width:100%">`;
    // Grid rings
    for (let ring = 1; ring <= 4; ring++) {
      const rr = r * ring / 4;
      let points = [];
      for (let i = 0; i < n; i++) {
        const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
        points.push(`${cx + rr * Math.cos(angle)},${cy + rr * Math.sin(angle)}`);
      }
      svg += `<polygon points="${points.join(' ')}" fill="none" stroke="var(--border)" stroke-width="0.5"/>`;
    }
    // Axes + labels
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      const x2 = cx + r * Math.cos(angle), y2 = cy + r * Math.sin(angle);
      svg += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="var(--border)" stroke-width="0.5"/>`;
      const lx = cx + (r + 18) * Math.cos(angle), ly = cy + (r + 18) * Math.sin(angle);
      svg += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--sub)" font-family="'Noto Sans KR',sans-serif">${radarSubjects[i].name}</text>`;
    }
    // Data polygon
    let dataPoints = [];
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      const val = Math.max(0, (10 - radarSubjects[i].avg) / 9);
      const dr = r * val;
      dataPoints.push(`${cx + dr * Math.cos(angle)},${cy + dr * Math.sin(angle)}`);
    }
    svg += `<polygon points="${dataPoints.join(' ')}" fill="rgba(28,90,96,0.15)" stroke="var(--teal-mid)" stroke-width="2"/>`;
    // Data dots
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      const val = Math.max(0, (10 - radarSubjects[i].avg) / 9);
      const dr = r * val;
      const dx = cx + dr * Math.cos(angle), dy = cy + dr * Math.sin(angle);
      svg += `<circle cx="${dx}" cy="${dy}" r="3" fill="var(--teal-mid)"/>`;
    }
    svg += `</svg></div>`;
    html += svg;
  }
  html += '</div>';

  // Combo scores
  html += '<div class="glass"><h3>교과 조합별 등급</h3>';
  html += '<p style="font-size:11px;color:var(--muted);margin-bottom:10px">대학별 반영 교과 조합에 따른 환산등급입니다.</p>';
  let bestCombo = null, bestScore = 99;
  COMBO_ORDER.forEach(combo => {
    if (!combos[combo]) return;
    const s = combos[combo];
    if (s.avg < bestScore) { bestScore = s.avg; bestCombo = combo; }
    const pct = Math.max(5, (10 - s.avg) / 9 * 100);
    const c = gradeColor(s.avg);
    html += `<div class="combo-bar">
      <span class="clbl">${esc(combo)}</span>
      <div class="cbar"><div class="cfill" style="width:${pct}%;background:${c}"></div></div>
      <span class="cval" style="color:${c}">${s.avg.toFixed(2)}</span>
    </div>`;
  });
  if (bestCombo) {
    html += `<div style="margin-top:8px;padding:8px 12px;background:var(--green-light);border-radius:8px;font-size:12px">
      <strong>최적 조합:</strong> ${esc(bestCombo)} (${bestScore.toFixed(2)}등급) — 이 조합을 반영하는 대학에서 가장 유리합니다.
    </div>`;
  }

  // Combo-specific trend sparklines
  const comboTrends = {};
  let hasComboTrend = false;
  COMBO_ORDER.forEach(combo => {
    if (!combos[combo]) return;
    const ct = calcComboTrend(student, combo);
    if (ct.length >= 2) { comboTrends[combo] = ct; hasComboTrend = true; }
  });
  if (hasComboTrend) {
    html += '<div style="margin-top:12px;padding:12px;background:var(--cream);border-radius:10px">';
    html += '<div style="font-size:12px;font-weight:700;margin-bottom:8px">조합별 학기 추이 (확률 반영)</div>';
    COMBO_ORDER.forEach(combo => {
      const ct = comboTrends[combo];
      if (!ct) return;
      const first = ct[0].avg, last = ct[ct.length-1].avg;
      const diff = last - first;
      const arrow = diff < -0.3 ? '↑' : diff > 0.3 ? '↓' : '→';
      const ac = diff < -0.3 ? 'var(--green)' : diff > 0.3 ? 'var(--red)' : 'var(--muted)';
      const svgW = 100, svgH = 24, pad = 3;
      const minV = Math.min(...ct.map(d => d.avg));
      const maxV = Math.max(...ct.map(d => d.avg));

// ═══════════════════════════════════════════════
// REAL ADMISSION CUTLINE MATCHING (Excel v5: 수박/어디가 실제 합격선)
// ═══════════════════════════════════════════════
// 학생 계열 판별: 자연(과학/수학/공학/의료) vs 인문(그 외)
function getStudentTrack(student, analysis) {
  const ra = analyzeRecord(student, analysis || {});
  const 자연개념 = ['과학','수학','공학','의료'];
  if (ra.concept && 자연개념.includes(ra.concept)) return '자연';
  if (ra.concept) return '인문';
  // fallback: 수학+과학 vs 국어+영어+사회 평균 비교
  const sa = calcSubjectAvgs(student);
  const g = n => { const s = sa.find(x => x.name === n); return s ? s.avg : null; };
  const sci = [g('수학'), g('과학')].filter(v => v != null);
  const hum = [g('국어'), g('영어'), g('사회')].filter(v => v != null);
  if (sci.length && hum.length) {
    const sciAvg = sci.reduce((a,b)=>a+b,0)/sci.length;
    const humAvg = hum.reduce((a,b)=>a+b,0)/hum.length;
    return sciAvg <= humAvg ? '자연' : '인문';
  }
  return '인문';
}

function normJeonType(s) {
  s = s || '';
  if (s.includes('논술')) return '논술';
  if (s.includes('종합')) return '종합';
  return '교과';
}

// 실제 합격선(평균등급) 대비 학생 평균등급 → 합격 확률
function probFromRealCut(cut, studentAvg, jt) {
  const gap = cut - studentAvg; // +면 학생이 컷보다 우수
  let p;
  if (jt === '교과') p = 50 + gap * 33;
  else if (jt === '종합') p = 50 + gap * 22;
  else p = 46 + gap * 14; // 논술: 내신 비중 낮음
  return Math.max(3, Math.min(97, Math.round(p)));
}

function realBand(prob) {
  if (prob >= 65) return { label: '안정', cls: 'band-safe', color: 'var(--green)' };
  if (prob >= 40) return { label: '적정', cls: 'band-fit', color: 'var(--blue)' };
  if (prob >= 15) return { label: '소신', cls: 'band-reach', color: 'var(--orange)' };
  return { label: '도전', cls: 'band-hard', color: 'var(--red)' };
}

// 목표 지역: 전과목 평균 5점대까지 수도권(서울·경기·인천), 6~7점대부터 충청권
function getTargetRegion(avg) {
  return avg < 6.0 ? '수도권' : '충청';
}
function inTargetRegion(region, target) {
  if (target === '수도권') return region === '서울' || region === '경기인천';
  return region === '충청';
}
const REGION_LABEL = { '서울': '서울', '경기인천': '경기·인천', '충청': '충청권', '기타': '기타' };
const REGION_COLOR = { '서울': 'var(--teal)', '경기인천': 'var(--blue)', '충청': 'var(--copper)', '기타': 'var(--muted)' };

// 지역 우선순위: 인서울(서울) > 인경기(경기·인천) > 충남권(충청) > 기타
const REGION_PRIORITY = { '서울': 0, '경기인천': 1, '충청': 2, '기타': 3 };

// 항목에서 지역 코드 추출 (문자열 대학명 / {region} / {univ} 모두 지원)
function regionOf(item) {
  if (item == null) return '기타';
  if (typeof item === 'string') return UNIV_REGION[item] || '기타';
  if (item.region) return item.region;
  if (item.univ) return UNIV_REGION[item.univ] || '기타';
  return '기타';
}

// ★ 공통 지역 정렬: 인서울→인경기→충남권→기타. 동일 지역 내에서는 secondaryCmp(기본: 기존 순서 유지)
function sortByRegionPriority(items, getRegion, secondaryCmp) {
  const rg = getRegion || regionOf;
  return [...items].sort((a, b) => {
    const ra = REGION_PRIORITY[rg(a)] ?? 3;
    const rb = REGION_PRIORITY[rg(b)] ?? 3;
    if (ra !== rb) return ra - rb;
    return secondaryCmp ? secondaryCmp(a, b) : 0;
  });
}

// 학생별 실제 합격선 매칭 결과
function matchRealAdmissions(student, analysis) {
  const track = getStudentTrack(student, analysis);
  const avg = calcWeightedAvg(student);
  const out = [];
  for (const [univ, data] of Object.entries(ADM_RESULTS)) {
    // 계열 우선: 학생 계열 → 전체 fallback
    let pool = (data[track] && data[track].length) ? data[track].slice() : [];
    if (data['전체'] && data['전체'].length) pool = pool.concat(data['전체']);
    if (!pool.length) continue;
    // 전형유형별 최고 확률 엔트리
    const byType = {};
    pool.forEach(e => {
      if (e.cut == null || e.cut < 0.5 || e.cut > 9) return; // 등급 스케일만
      const jt = normJeonType(e.jt);
      const prob = probFromRealCut(e.cut, avg, jt);
      const cur = byType[jt];
      if (!cur || prob > cur.prob) {
        byType[jt] = { jt, jn: e.jn, cut: e.cut, prob, reg: e.reg || '', yr: e.yr || '',
                       ratio: e.ratio || '', fill: e.fill || '', ind: e.ind || '' };
      }
    });
    const entries = Object.values(byType).sort((a,b) => b.prob - a.prob);
    const best = entries[0];
    out.push({
      univ, region: UNIV_REGION[univ] || '기타', track,
      bestProb: best.prob, bestType: best.jt, bestCut: best.cut,
      entries
    });
  }
  return out.sort((a,b) => b.bestProb - a.bestProb);
}
