<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 게임 대복제시대 — 이해 노트</title>
<style>
@font-face { font-family: "KR"; font-weight: 400; src: url(fonts/kr400.woff2) format("woff2"); font-display: block; }
@font-face { font-family: "KR"; font-weight: 700; src: url(fonts/kr700.woff2) format("woff2"); font-display: block; }
@font-face { font-family: "KR"; font-weight: 900; src: url(fonts/kr900.woff2) format("woff2"); font-display: block; }
@font-face { font-family: "BHS"; src: url(fonts/bhs.woff2) format("woff2"); font-display: block; }
@font-face { font-family: "PX"; src: url(fonts/px.woff2) format("woff2"); font-display: block; }
html, body { margin: 0; height: 100%; background: #05070f; color: #ddd; font-family: system-ui, sans-serif; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
#stage { width: min(100vw, calc((100vh - 64px) * 16 / 9)); aspect-ratio: 16 / 9; display: block; background: #000; }
#bar { display: flex; align-items: center; gap: 10px; width: min(100vw - 32px, 960px); }
#bar button { background: #1d2440; color: #fff; border: 0; border-radius: 6px; padding: 6px 14px; font-size: 14px; cursor: pointer; }
#bar input { flex: 1; }
#bar span { font-variant-numeric: tabular-nums; font-size: 13px; min-width: 104px; text-align: right; }
body.capture #bar { display: none; }
body.capture #stage { width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<div id="bar">
  <button id="play">▶ 재생</button>
  <input id="seek" type="range" min="0" max="136" step="0.0333" value="0">
  <span id="clock">0.00 / 136.00</span>
</div>
<script>
/* ------------------------------------------------------------------
   AI 게임 대복제시대 — 이해용 요약 영상. 136초, 1920×1080, 30fps.
   내용 출처: 뀨놀의 게임 읽기 (2026.11.1 방송)의 해설. 비유는 이해를 돕기 위해 덧붙인 것.
   모든 프레임은 render(t)의 순수 함수다 (같은 t → 같은 그림).
   기법: T10 개념 도해 자동 그리기 · T09 전·후 비교 스플릿 · T20 인용문 카드
------------------------------------------------------------------- */
const W = 1920, H = 1080, DUR = 136;
window.__meta = { duration: DUR, fps: 30, width: W, height: H };
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const minJerk = u => { u = clamp(u); return u * u * u * (10 - 15 * u + 6 * u * u); };
const spring = s => s <= 0 ? 0 : 1 - Math.exp(-6 * s) * Math.cos(12 * s);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const C = { ink: '#EEF2FF', dim: 'rgba(238,242,255,0.62)', green: '#5CF2A5', pink: '#FF6B9A', yellow: '#FFD24A', cyan: '#5AD7FF', red: '#FF5A5A', panel: 'rgba(255,255,255,0.055)' };
const F = { kr: (s, w = 700) => `${w} ${s}px KR, sans-serif`, big: s => `${s}px BHS, KR, sans-serif`, px: s => `${s}px PX, monospace` };

// ---------- 배경: 어두운 격자 + 천천히 흐르는 점 ----------
const rnd = mulberry32(20261101);
const BG = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, '#0C1124'); gr.addColorStop(1, '#090B18'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(120,150,255,0.055)'; g.lineWidth = 1;
  for (let x = 0; x <= W; x += 60) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y <= H; y += 60) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,8,0.6)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
  return c;
})();
const BITS = Array.from({ length: 40 }, () => ({ x: Math.floor(rnd() * 32) * 60, y: rnd() * H, v: 12 + rnd() * 30, s: 4 + Math.floor(rnd() * 3) * 2, ph: rnd() * 6.28, c: [C.green, C.cyan, C.pink][Math.floor(rnd() * 3)] }));
function drawBG(t) {
  ctx.drawImage(BG, 0, 0);
  for (const b of BITS) {
    const y = ((b.y - b.v * t) % (H + 40) + (H + 40)) % (H + 40) - 20;
    ctx.globalAlpha = 0.10 + 0.10 * (0.5 + 0.5 * Math.sin(b.ph + t * 1.3)); ctx.fillStyle = b.c; ctx.fillRect(b.x - b.s / 2, y, b.s, b.s);
  }
  ctx.globalAlpha = 1;
}

// ---------- 그리기 도구 ----------
function text(str, x, y, font, color, align = 'left', alpha = 1) {
  if (alpha <= 0) return; ctx.save(); ctx.globalAlpha *= alpha; ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y); ctx.restore();
}
const mw = (str, font) => { ctx.font = font; return ctx.measureText(str).width; };
const fit = (str, maxW, size, w = 700) => Math.min(size, size * maxW / mw(str, F.kr(size, w)));
const wrapCache = new Map();
function wrap(str, maxW, font) {
  const key = font + '|' + maxW + '|' + str; if (wrapCache.has(key)) return wrapCache.get(key);
  ctx.font = font; const lines = []; let cur = '';
  for (const w of str.split(' ')) { const nx = cur ? cur + ' ' + w : w; if (ctx.measureText(nx).width > maxW && cur) { lines.push(cur); cur = w; } else cur = nx; }
  if (cur) lines.push(cur); wrapCache.set(key, lines); return lines;
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function panel(x, y, w, h, color, fill = C.panel, lw = 3) { rrect(x, y, w, h, 20); ctx.fillStyle = fill; ctx.fill(); if (color) { ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke(); } }
function head(tag, title, s, color = C.green) {
  text(tag, 110, 96, F.px(24), color, 'left', easeOut(prog(s, 0.1, 0.5)));
  const k = easeOut(prog(s, 0.2, 0.8)); ctx.save(); ctx.translate((1 - k) * -30, 0); text(title, 108, 172, F.kr(60, 900), C.ink, 'left', k); ctx.restore();
}
function arrowH(x0, x1, y, k, color = C.ink) {
  if (k <= 0) return; const xe = lerp(x0, x1, k);
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(xe, y); if (k > 0.9) { ctx.moveTo(xe - 12, y - 11); ctx.lineTo(xe, y); ctx.lineTo(xe - 12, y + 11); } ctx.stroke(); ctx.restore();
}

// ---------- 0. 도입: 48시간, 14개 ----------
function sHook(s, t) {
  const out1 = 1 - prog(s, 6.0, 6.5);
  text('스팀에 인디 게임 하나가 공개됐다', W / 2, 250, F.kr(52, 700), C.ink, 'center', easeOut(prog(s, 0.3, 0.9)) * out1);
  const n = Math.round(48 * easeOut(prog(s, 1.5, 2.7))), a = prog(s, 1.4, 1.7);
  ctx.save(); ctx.globalAlpha *= a;
  const wn = mw('48', F.big(300)), wt = mw('시간 뒤', F.kr(84, 900)), x0 = W / 2 - (wn + 30 + wt) / 2;
  text(String(n).padStart(2, '0'), x0, 580, F.big(300), C.yellow); text('시간 뒤', x0 + wn + 30, 570, F.kr(84, 900), C.ink);
  ctx.restore();
  for (let i = 0; i < 14; i++) {
    const k = spring(s - 3.6 - i * 0.08); if (k <= 0) continue;
    const x = W / 2 - 7 * 92 + i * 92 + 46, y = 730 + Math.sin(t * 2 + i) * 3, col = [C.pink, C.cyan, C.green, C.yellow][i % 4];
    ctx.save(); ctx.translate(x, y); ctx.scale(k, k); rrect(-36, -36, 72, 72, 14); ctx.fillStyle = col; ctx.fill();
    ctx.fillStyle = '#0B0F1E'; ctx.fillRect(-18, -12, 10, 10); ctx.fillRect(8, -12, 10, 10); ctx.fillRect(-14, 10, 28, 6); ctx.restore();
  }
  text('로블록스에 똑같은 게임이 14개 넘게 올라왔다', W / 2, 870, F.kr(48, 700), C.ink, 'center', easeOut(prog(s, 4.9, 5.5)));
  const k = spring(s - 6.6);
  if (k > 0) { ctx.save(); ctx.translate(W / 2, 250); ctx.scale(lerp(0.8, 1, k), lerp(0.8, 1, k)); text('AI 게임 대복제시대', 0, 20, F.big(104), C.pink, 'center', clamp((s - 6.6) / 0.15)); ctx.restore(); }
}

// ---------- 1. 세 가지 질문 ----------
function sMission(s) {
  head('MISSION', '오늘 풀 세 가지 질문', s);
  [['STAGE 1', '기술로 어디까지 가능한가?', C.green], ['STAGE 2', '왜 갑자기 폭발했나?', C.yellow], ['STAGE 3', '막을 방법은 있나?', C.pink]].forEach(([tag, q, col], i) => {
    const k = easeOut(prog(s, 1.0 + i * 1.1, 1.6 + i * 1.1)); if (k <= 0) return;
    const y = 290 + i * 210;
    ctx.save(); ctx.globalAlpha *= k; ctx.translate((1 - k) * 60, 0);
    panel(260, y, 1400, 160, col); text(tag, 310, y + 96, F.px(28), col); text(q, 600, y + 104, F.kr(64, 900), C.ink); ctx.restore();
  });
}

// ---------- 2. 다섯 가지 방법 (T10: 단계가 차례로 등장) ----------
const TYPES = [
  ['정밀 디컴파일', '완성된 빵만 보고 레시피를 똑같이 되살리기', 5, '약 3개월 · 수십만 달러'],
  ['네이티브 이식', '게임기 전용 게임을 PC에서 바로 돌게 옮기기', 4, '1~2주'],
  ['게임 합치기', '두 게임을 동시에 켜 놓고 화면을 겹치기', 3, '사람은 잘 안 하던 방식'],
  ['코드 베끼기', '남의 게임을 내려받아 겉모습만 바꿔 내기', 2, '유니티 게임은 특히 쉬움'],
  ['아이디어 베끼기', '소개 영상만 보고 똑같은 게임 만들기', 1, '38시간 · 수 달러'],
];
function sTypes(s, t) {
  head('STAGE 1', '복제의 다섯 가지 방법', s);
  text('어려움', 1150, 226, F.kr(26, 700), C.dim, 'left', prog(s, 0.8, 1.2)); text('걸린 시간 · 비용', 1420, 226, F.kr(26, 700), C.dim, 'left', prog(s, 0.8, 1.2));
  const spot = easeOut(prog(s, 21.5, 22.3));
  TYPES.forEach(([name, ana, lv, cost], i) => {
    const t0 = 1.0 + i * 4, k = easeOut(prog(s, t0, t0 + 0.6)); if (k <= 0) return;
    const y = 244 + i * 132, last = i === 4, col = last ? C.pink : C.green;
    ctx.save(); ctx.globalAlpha *= k * (last ? 1 : lerp(1, 0.55, spot)); ctx.translate((1 - k) * 50, 0);
    panel(110, y, 1700, 112, last && spot > 0 ? C.pink : null, last && spot > 0 ? `rgba(255,107,154,${0.10 + 0.05 * Math.sin(t * 4)})` : C.panel, 4);
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(172, y + 56, 30, 0, 6.283); ctx.fill(); text(String(i + 1), 172, y + 72, F.kr(42, 900), '#0B0F1E', 'center');
    text(name, 232, y + 52, F.kr(42, 900), C.ink);
    text(ana, 232, y + 94, F.kr(29, 400), C.dim, 'left', easeOut(prog(s, t0 + 0.7, t0 + 1.2)));
    for (let j = 0; j < 5; j++) {
      const on = j < lv, pk = spring(s - t0 - 1.0 - j * 0.07); if (pk <= 0) continue;
      ctx.save(); ctx.translate(1150 + j * 44 + 17, y + 56); ctx.scale(pk, pk); rrect(-17, -17, 34, 34, 7); ctx.fillStyle = on ? col : 'rgba(255,255,255,0.10)'; ctx.fill(); ctx.restore();
    }
    text(cost, 1420, y + 68, F.kr(fit(cost, 360, 32), 700), C.yellow, 'left', easeOut(prog(s, t0 + 1.6, t0 + 2.1)));
    ctx.restore();
  });
  const ck = spring(s - 22.6);
  if (ck > 0) { ctx.save(); ctx.translate(W / 2, 968); ctx.scale(lerp(0.8, 1, ck), lerp(0.8, 1, ck)); text('가장 쉬운 ⑤번이, 피해는 가장 크다', 0, 0, F.kr(52, 900), C.pink, 'center', clamp((s - 22.6) / 0.15)); ctx.restore(); }
}

// ---------- 3. 비교 (T09 스플릿) ----------
function sSplit(s) {
  head('STAGE 1', '가장 쉬운 것이 가장 아프다', s);
  const side = (x, tag, name, big, small, note, col, t0) => {
    const k = easeOut(prog(s, t0, t0 + 0.7)); if (k <= 0) return;
    ctx.save(); ctx.globalAlpha *= k; ctx.translate(0, (1 - k) * 40);
    panel(x, 250, 800, 500, col);
    text(tag, x + 50, 320, F.px(22), col); text(name, x + 50, 392, F.kr(50, 900), C.ink);
    text(big, x + 50, 540, F.big(120), col, 'left', easeOut(prog(s, t0 + 0.6, t0 + 1.1)));
    text(small, x + 50, 620, F.kr(50, 700), C.ink, 'left', easeOut(prog(s, t0 + 1.0, t0 + 1.5)));
    text(note, x + 50, 700, F.kr(36, 700), C.dim, 'left', easeOut(prog(s, t0 + 1.6, t0 + 2.1)));
    ctx.restore();
  };
  side(110, 'HARD', '① 정밀 디컴파일', '약 3개월', '수십만 달러', '뉴스가 주목하는 쪽', C.cyan, 0.9);
  side(1010, 'EASY', '⑤ 아이디어 베끼기', '38시간', '수 달러', '실제 피해가 큰 쪽', C.pink, 3.4);
  const vk = spring(s - 3.0); if (vk > 0) { ctx.save(); ctx.translate(960, 500); ctx.scale(vk, vk); text('VS', 0, 12, F.px(34), C.yellow, 'center'); ctx.restore(); }
  text('인디 개발자의 무기는 자본이 아니라 아이디어다', W / 2, 860, F.kr(50, 900), C.yellow, 'center', easeOut(prog(s, 7.0, 7.7)));
  text('그런데 아이디어는 법으로 보호받기 어렵다 (해설자의 설명)', W / 2, 940, F.kr(38, 700), C.ink, 'center', easeOut(prog(s, 9.2, 9.9)));
}

// ---------- 4a. 왜 지금: 다섯 조각 ----------
const WHY = [
  ['더 똑똑한 새 모델', '9~10월에 새 모델이 나온 뒤 사례가 몰렸다'],
  ['채점으로 훈련', '정답이 없어도 점수만 매기면 배운다'],
  ['화면을 본다', '스크린샷을 보고 스스로 고친다'],
  ['도구 연결', '게임 엔진을 AI가 직접 다룬다 (MCP)'],
  ['비용 폭락', '4,560달러 들던 일이 1센트에 (사례)'],
];
function sWhy(s) {
  head('STAGE 2', '왜 갑자기 폭발했나', s, C.yellow);
  WHY.forEach(([title, body], i) => {
    const t0 = 1.0 + i * 2.5, k = spring(s - t0), x = 105 + i * 350, y = 300;
    if (i > 0) arrowH(x - 34, x - 6, y + 150, easeOut(prog(s, t0 - 0.5, t0)), C.yellow);
    if (k <= 0) return;
    ctx.save(); ctx.globalAlpha *= clamp((s - t0) / 0.15); ctx.translate(x + 155, y + 150); ctx.scale(lerp(0.75, 1, k), lerp(0.75, 1, k)); ctx.translate(-155, -150);
    panel(0, 0, 310, 300, C.yellow);
    text(String(i + 1).padStart(2, '0'), 30, 62, F.px(26), C.yellow);
    text(title, 30, 126, F.kr(fit(title, 250, 38, 900), 900), C.ink);
    wrap(body, 250, F.kr(28, 400)).forEach((ln, j) => text(ln, 30, 182 + j * 40, F.kr(28, 400), C.dim, 'left', easeOut(prog(s, t0 + 0.5, t0 + 1.0))));
    ctx.restore();
  });
  text('전문가만 하던 일을, 이제는 누구나', W / 2, 760, F.kr(64, 900), C.yellow, 'center', easeOut(prog(s, 14.0, 14.7)));
  text('다섯 가지가 올해 한꺼번에 맞물렸다', W / 2, 850, F.kr(40, 700), C.ink, 'center', easeOut(prog(s, 15.2, 15.9)));
}

// ---------- 4b. 핵심 원리: 채점 → 반복 ----------
const LOOP = ['실행한다', '화면을 찍는다', '원본과 비교해 채점', '코드를 고친다'];
function sLoop(s, t) {
  head('STAGE 2', '핵심 원리: 채점할 수 있으면 무한 반복', s, C.yellow);
  const cx = 520, cy = 600, r = 240, pos = i => [cx + Math.cos(-Math.PI / 2 + i * Math.PI / 2) * r, cy + Math.sin(-Math.PI / 2 + i * Math.PI / 2) * r];
  const ringK = easeOut(prog(s, 0.8, 2.0));
  ctx.save(); ctx.strokeStyle = 'rgba(255,210,74,0.5)'; ctx.lineWidth = 5; ctx.setLineDash([14, 14]); ctx.lineDashOffset = -t * 40;
  ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + 6.283 * ringK); ctx.stroke(); ctx.restore();
  // 회전 수: 처음엔 천천히, 갈수록 빠르게 (s만의 함수)
  const turns = s < 3.5 ? 0 : 0.35 * (s - 3.5) + 0.06 * Math.pow(s - 3.5, 2.2);
  LOOP.forEach((lab, i) => {
    const k = spring(s - 1.2 - i * 0.5); if (k <= 0) return; const [x, y] = pos(i);
    const hot = s > 3.5 && Math.floor(turns * 4) % 4 === i;
    ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
    const w = mw(lab, F.kr(34, 900)) + 56; rrect(-w / 2, -40, w, 80, 40); ctx.fillStyle = hot ? C.yellow : '#1A2140'; ctx.fill(); ctx.strokeStyle = C.yellow; ctx.lineWidth = 3; ctx.stroke();
    text(lab, 0, 12, F.kr(34, 900), hot ? '#0B0F1E' : C.ink, 'center'); ctx.restore();
  });
  if (s > 3.5) {
    const a = -Math.PI / 2 + turns * 6.283;
    ctx.fillStyle = C.pink; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 13, 0, 6.283); ctx.fill();
    const reps = Math.floor(turns);
    text('반복', cx, cy - 26, F.kr(34, 700), C.dim, 'center'); text(reps.toLocaleString('en-US') + '회', cx, cy + 50, F.big(84), C.pink, 'center');
    text('사람 없이', cx, cy + 100, F.kr(30, 700), C.dim, 'center', easeOut(prog(s, 5.5, 6.1)));
  }
  // 오른쪽: 게임은 최고의 연습장
  const pk = easeOut(prog(s, 8.0, 8.7));
  if (pk > 0) {
    ctx.save(); ctx.globalAlpha *= pk; ctx.translate((1 - pk) * 50, 0);
    panel(1010, 280, 800, 620, C.green);
    text('게임은 AI에게 최고의 연습장', 1060, 362, F.kr(46, 900), C.green);
    ['점수가 바로 나온다', '똑같은 상황을 다시 할 수 있다', '여러 개를 동시에 돌릴 수 있다', '빨리 감기가 된다'].forEach((it, i) => {
      const k = easeOut(prog(s, 9.2 + i * 1.3, 9.8 + i * 1.3)); if (k <= 0) return; const y = 470 + i * 108;
      ctx.save(); ctx.globalAlpha *= k; ctx.strokeStyle = C.green; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(1066, y - 14); ctx.lineTo(1084, y + 4); ctx.lineTo(1114, y - 30); ctx.stroke();
      text(it, 1144, y, F.kr(40, 700), C.ink); ctx.restore();
    });
    ctx.restore();
  }
}

// ---------- 5. 대책 ----------
const DEF = [
  ['난독화', '코드를 읽기 어렵게 꼬기', '100달러면 뚫린다'],
  ['서버에서 처리', '중요한 계산을 서버에 숨기기', '서버까지 복제된다'],
  ['스트리밍', '게임 파일 없이 영상만 보내기', '직접 해 보며 규칙을 알아낸다'],
  ['복제 게임 걸러내기', '비슷한 게임을 자동으로 찾기', 'AI가 만든 것인지 가려내기 어렵다'],
  ['플랫폼의 단속', '스토어가 직접 막아 주기', '기대하기 어렵다 (AI 제작을 성과로 발표)'],
];
function sDef(s) {
  head('STAGE 3', '막을 방법은 있나', s, C.pink);
  DEF.forEach(([name, what, verdict], i) => {
    const t0 = 1.0 + i * 3.5, k = easeOut(prog(s, t0, t0 + 0.6)); if (k <= 0) return; const y = 236 + i * 132;
    ctx.save(); ctx.globalAlpha *= k; ctx.translate((1 - k) * 50, 0);
    panel(110, y, 1700, 112, null);
    // 방패
    ctx.save(); ctx.translate(172, y + 56); ctx.strokeStyle = C.cyan; ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-24, -26); ctx.lineTo(24, -26); ctx.lineTo(24, 4); ctx.quadraticCurveTo(22, 24, 0, 32); ctx.quadraticCurveTo(-22, 24, -24, 4); ctx.closePath(); ctx.stroke(); ctx.restore();
    text(name, 232, y + 52, F.kr(42, 900), C.ink); text(what, 232, y + 94, F.kr(29, 400), C.dim);
    const xk = minJerk(prog(s, t0 + 1.5, t0 + 1.9));
    if (xk > 0) {
      ctx.strokeStyle = C.red; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(226, y + 38); ctx.lineTo(226 + (mw(name, F.kr(42, 900)) + 12) * xk, y + 38); ctx.stroke();
      ctx.save(); ctx.translate(172, y + 56); ctx.beginPath(); ctx.moveTo(-26, -26); ctx.lineTo(-26 + 52 * xk, -26 + 56 * xk); ctx.stroke(); ctx.restore();
    }
    const vk = easeOut(prog(s, t0 + 1.8, t0 + 2.3));
    if (vk > 0) { arrowH(900, 950, y + 56, vk, C.red); text(verdict, 980, y + 70, F.kr(fit(verdict, 790, 38, 900), 900), C.red, 'left', vk); }
    ctx.restore();
  });
  const ck = spring(s - 19.6);
  if (ck > 0) { ctx.save(); ctx.translate(W / 2, 968); ctx.scale(lerp(0.8, 1, ck), lerp(0.8, 1, ck)); text('기술로는 늦출 수 있을 뿐, 막기는 어렵다', 0, 0, F.kr(54, 900), C.ink, 'center', clamp((s - 19.6) / 0.15)); ctx.restore(); }
}

// ---------- 6. 결론 + 인용문 카드 (T20) ----------
function sEnd(s, t) {
  head('ENDING', '그래서 남는 것', s, C.cyan);
  [['사람의 큐레이션', '좋은 게임을 골라 소개하고 보증해 주는 사람들', C.cyan], ['게임 문화', 'AI 복제작에 등을 돌리는 게이머들', C.green]].forEach(([a, b, col], i) => {
    const k = easeOut(prog(s, 1.0 + i * 1.4, 1.7 + i * 1.4)); if (k <= 0) return; const x = 110 + i * 870;
    ctx.save(); ctx.globalAlpha *= k; ctx.translate(0, (1 - k) * 40 + Math.sin(t * 1.3 + i * 2) * 4);
    panel(x, 260, 830, 250, col); text(a, x + 50, 364, F.kr(64, 900), col); text(b, x + 50, 444, F.kr(fit(b, 730, 34, 700), 700), C.ink); ctx.restore();
  });
  const qk = easeOut(prog(s, 4.8, 5.6));
  if (qk > 0) {
    ctx.save(); ctx.globalAlpha *= qk; ctx.translate(0, (1 - qk) * 30);
    panel(260, 590, 1400, 300, null, 'rgba(255,255,255,0.08)');
    text('“', 310, 720, F.big(160), C.yellow);
    text('어떻게 해야 할지는 아직 아무도 모른다.', 420, 700, F.kr(52, 900), C.ink, 'left', easeOut(prog(s, 5.4, 6.0)));
    text('그래도, 믿고 싶다.', 420, 784, F.kr(52, 900), C.yellow, 'left', easeOut(prog(s, 6.8, 7.4)));
    text('— 해설자의 결론 (요약)', 1610, 850, F.kr(30, 700), C.dim, 'right', easeOut(prog(s, 7.8, 8.4)));
    ctx.restore();
  }
  text('내용 출처: 뀨놀의 게임 읽기 (2026.11.1 방송) · 비유는 이해를 돕기 위해 덧붙임', W / 2, 980, F.kr(28, 400), C.dim, 'center', easeOut(prog(s, 8.6, 9.2)));
}

// ---------- 합성 ----------
const SC = [
  { a: 0, b: 9, f: sHook }, { a: 9, b: 19, f: sMission }, { a: 19, b: 47, f: sTypes }, { a: 47, b: 61, f: sSplit },
  { a: 61, b: 80, f: sWhy }, { a: 80, b: 98, f: sLoop }, { a: 98, b: 122, f: sDef }, { a: 122, b: 137, f: sEnd },
];
function render(t) {
  t = clamp(t, 0, DUR);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.setLineDash([]);
  drawBG(t);
  SC.forEach((sc, i) => {
    if (t < sc.a - 0.01 || t > sc.b) return;
    const s = t - sc.a, out = i === SC.length - 1 ? 0 : easeIn(prog(t, sc.b - 0.45, sc.b));
    ctx.save(); ctx.globalAlpha = clamp(s / 0.4) * (1 - out); ctx.translate(-out * 40, 0); sc.f(s, t); ctx.restore();
  });
  // 진행 막대
  ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fillRect(110, 1044, 1700, 6);
  ctx.fillStyle = C.green; ctx.fillRect(110, 1044, 1700 * t / DUR, 6);
  SC.slice(1).forEach(sc => { ctx.fillStyle = '#0B0F1E'; ctx.fillRect(110 + 1700 * sc.a / DUR - 2, 1042, 4, 10); });
  const end = prog(t, DUR - 0.6, DUR);
  if (end > 0) { ctx.fillStyle = `rgba(0,0,0,${end * 0.8})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- 플레이어 ----------
const params = new URLSearchParams(location.search);
if (params.has('capture')) document.body.classList.add('capture');
window.__render = render;
window.__ready = Promise.all(['400 40px KR', '700 40px KR', '900 40px KR', '40px BHS', '40px PX'].map(f => document.fonts.load(f, 'A가0“⑤'))).then(() => document.fonts.ready);
const playBtn = document.getElementById('play'), seek = document.getElementById('seek'), clock = document.getElementById('clock');
let cur = parseFloat(params.get('t') || '0') || 0, playing = false, last = 0;
function show(t) { cur = t; render(t); seek.value = t; clock.textContent = `${t.toFixed(2)} / ${DUR.toFixed(2)}`; }
function loop(now) { if (!playing) return; cur += (now - last) / 1000; last = now; if (cur >= DUR) { cur = DUR; playing = false; playBtn.textContent = '▶ 재생'; } show(cur); if (playing) requestAnimationFrame(loop); }
function toggle() { if (playing) { playing = false; playBtn.textContent = '▶ 재생'; return; } if (cur >= DUR) cur = 0; playing = true; playBtn.textContent = '❚❚ 일시정지'; last = performance.now(); requestAnimationFrame(loop); }
playBtn.onclick = toggle;
seek.oninput = () => { playing = false; playBtn.textContent = '▶ 재생'; show(parseFloat(seek.value)); };
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
window.__ready.then(() => show(cur));
</script>
